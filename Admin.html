  <script>
    const GAS_API_URL = ''; // Automatically received from index.html and stored in this browser.

    (function setupAppsScriptBridge() {
      'use strict';

      const STORAGE_KEY = 'kip_gas_api_url';
      const CHANNEL = 'KIP_GAS_RPC';
      const pendingRequests = new Map();
      let requestCounter = 0;
      let bridgeReady = false;
      let bridgeIframe = null;
      let bridgeReadyResolver = null;

      function isValidApiUrl(value) {
        return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:[?#].*)?$/.test(
          String(value || '').trim()
        );
      }

      function saveApiUrl(value) {
        if (!isValidApiUrl(value)) return;
        try { localStorage.setItem(STORAGE_KEY, String(value).trim()); } catch (ignored) {}
      }

      function readStoredApiUrl() {
        try { return localStorage.getItem(STORAGE_KEY) || ''; } catch (ignored) { return ''; }
      }

      function resolveApiUrl() {
        const queryValue = new URLSearchParams(window.location.search).get('api') || '';

        if (isValidApiUrl(queryValue)) {
          saveApiUrl(queryValue);
          return queryValue.trim();
        }

        if (isValidApiUrl(GAS_API_URL)) {
          saveApiUrl(GAS_API_URL);
          return GAS_API_URL.trim();
        }

        const storedValue = readStoredApiUrl();
        return isValidApiUrl(storedValue) ? storedValue.trim() : '';
      }

      function clientBaseUrl() {
        return new URL('.', window.location.href).href;
      }

      const apiUrl = resolveApiUrl();
      window.KIP_API_URL = apiUrl;

      window.buildGitHubPageUrl = function buildGitHubPageUrl(fileName) {
        const url = new URL(fileName, window.location.href);
        if (apiUrl) url.searchParams.set('api', apiUrl);
        return url.href;
      };

      function initializeIframeBridge() {
        if (!apiUrl || bridgeIframe) return;

        bridgeIframe = document.createElement('iframe');
        bridgeIframe.title = 'KIP Apps Script Bridge';
        bridgeIframe.setAttribute('aria-hidden', 'true');
        bridgeIframe.style.position = 'fixed';
        bridgeIframe.style.width = '1px';
        bridgeIframe.style.height = '1px';
        bridgeIframe.style.opacity = '0';
        bridgeIframe.style.pointerEvents = 'none';
        bridgeIframe.style.border = '0';
        bridgeIframe.style.left = '-9999px';
        bridgeIframe.src = apiUrl;

        (document.body || document.documentElement).appendChild(bridgeIframe);
      }

      window.addEventListener('message', function (event) {
        if (!bridgeIframe || event.source !== bridgeIframe.contentWindow) return;

        const payload = event.data || {};
        if (payload.channel !== CHANNEL) return;

        if (payload.type === 'ready') {
          bridgeReady = true;
          if (bridgeReadyResolver) {
            bridgeReadyResolver(true);
            bridgeReadyResolver = null;
          }
          return;
        }

        if (payload.type !== 'response' || !pendingRequests.has(payload.id)) return;

        const pending = pendingRequests.get(payload.id);
        pendingRequests.delete(payload.id);
        clearTimeout(pending.timeoutId);

        if (payload.ok === true) {
          pending.resolve(payload.result);
        } else {
          pending.reject(new Error(payload.error || 'Apps Script request failed.'));
        }
      });

      function waitForIframeBridge() {
        initializeIframeBridge();

        if (bridgeReady) return Promise.resolve(true);
        if (!bridgeIframe) return Promise.resolve(false);

        return new Promise(function (resolve) {
          let settled = false;

          bridgeReadyResolver = function (value) {
            if (settled) return;
            settled = true;
            resolve(value);
          };

          setTimeout(function () {
            if (settled) return;
            settled = true;
            bridgeReadyResolver = null;
            resolve(false);
          }, 8000);
        });
      }

      function invokeThroughIframe(action, args) {
        return new Promise(function (resolve, reject) {
          const id = 'rpc-' + Date.now() + '-' + (++requestCounter);
          const timeoutId = setTimeout(function () {
            pendingRequests.delete(id);
            reject(new Error('Apps Script bridge tidak merespons.'));
          }, 60000);

          pendingRequests.set(id, { resolve, reject, timeoutId });
          bridgeIframe.contentWindow.postMessage({
            channel: CHANNEL,
            type: 'request',
            id,
            action,
            args,
            clientBaseUrl: clientBaseUrl()
          }, '*');
        });
      }

      async function invokeThroughFetch(action, args) {
        const formBody = new URLSearchParams();
        formBody.set('payload', JSON.stringify({
          action,
          args,
          clientBaseUrl: clientBaseUrl()
        }));

        const response = await fetch(apiUrl, {
          method: 'POST',
          body: formBody,
          redirect: 'follow'
        });

        const responseText = await response.text();
        let payload;

        try {
          payload = JSON.parse(responseText);
        } catch (error) {
          throw new Error(
            'Respons GAS bukan JSON. Pastikan deployment dijalankan sebagai pemilik dan aksesnya diatur ke Anyone.'
          );
        }

        if (!payload || payload.ok !== true) {
          throw new Error(payload && payload.error ? payload.error : 'Respons API tidak valid.');
        }

        return payload.result;
      }

      async function invokeApi(action, args) {
        if (!apiUrl) {
          throw new Error('GAS API URL belum tersedia. Buka index.html terlebih dahulu dari repository GitHub Pages yang sama.');
        }

        const ready = await waitForIframeBridge();

        if (ready) {
          try {
            return await invokeThroughIframe(action, args);
          } catch (iframeError) {
            console.warn('Iframe bridge failed, using fetch fallback.', iframeError);
          }
        }

        return invokeThroughFetch(action, args);
      }

      function createRunner(successHandler, failureHandler) {
        return new Proxy({}, {
          get: function (_target, property) {
            if (property === 'withSuccessHandler') {
              return function (handler) {
                return createRunner(handler, failureHandler);
              };
            }

            if (property === 'withFailureHandler') {
              return function (handler) {
                return createRunner(successHandler, handler);
              };
            }

            return function () {
              const args = Array.prototype.slice.call(arguments);

              invokeApi(String(property), args)
                .then(function (result) {
                  if (typeof successHandler === 'function') successHandler(result);
                })
                .catch(function (error) {
                  if (typeof failureHandler === 'function') {
                    failureHandler(error);
                  } else if (typeof successHandler === 'function') {
                    successHandler({ success: false, message: error.message });
                  } else {
                    console.error(error);
                  }
                });
            };
          }
        });
      }

      window.google = window.google || {};
      window.google.script = window.google.script || {};
      window.google.script.run = createRunner(null, null);

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeIframeBridge, { once: true });
      } else {
        initializeIframeBridge();
      }
    })();
  </script>

  <script>
    window.addEventListener('error', function(event) {
      var root = document.getElementById('root');
      if (!root) return;

      root.innerHTML =
        '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f3f4f6;padding:24px;">' +
          '<div style="max-width:720px;width:100%;background:#fff;border:1px solid #fecaca;border-radius:16px;padding:24px;box-shadow:0 10px 25px rgba(0,0,0,.08);">' +
            '<h2 style="font-size:22px;font-weight:800;color:#b91c1c;margin:0 0 12px;">Admin Dashboard gagal dimuat</h2>' +
            '<p style="color:#4b5563;margin:0 0 12px;">Terjadi kesalahan JavaScript. Detail:</p>' +
            '<pre style="white-space:pre-wrap;word-break:break-word;background:#f9fafb;border-radius:10px;padding:14px;color:#111827;">' +
              String(event.message || 'Unknown error') +
            '</pre>' +
          '</div>' +
        '</div>';
    });
  </script>

  <div id="root">
    <div class="min-h-screen flex items-center justify-center bg-gray-100">
      <div class="bg-white border border-gray-200 shadow-sm rounded-2xl p-8 text-center">
        <div class="text-3xl mb-3">⏳</div>
        <p class="font-bold text-gray-800">Memuat Admin Dashboard...</p>
        <p class="text-sm text-gray-500 mt-1">Mohon tunggu beberapa saat.</p>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function AdminDashboard() {
      // --- STATE UTAMA ---
      const ROLES = ['English Trainer', 'Admin', 'Team Leader'];
      const FIXED_FORM_FIELDS = [
        { id: 1, label: 'Full Name', name: 'Nama', type: 'text', active: true },
        { id: 2, label: 'Address', name: 'Alamat', type: 'textarea', active: true },
        { id: 3, label: 'Email', name: 'Email', type: 'email', active: true },
        { id: 4, label: 'WA Number', name: 'NoWA', type: 'tel', active: true },
        { id: 5, label: 'Social Media', name: 'Social Media', type: 'text', active: true },
        { id: 6, label: 'Position Applied', name: 'Posisi', type: 'select', active: true },
        { id: 7, label: 'Teaching Audience', name: 'TeachingAudience', type: 'text', active: true },
        { id: 8, label: 'Proficiency Level', name: 'Proficiency Level', type: 'select', active: true },
        { id: 9, label: 'Certificate', name: 'Certificate', type: 'file', active: true },
        { id: 10, label: 'CV', name: 'CV', type: 'file', active: true },
        { id: 11, label: 'Portfolio / LinkedIn', name: 'Portofolio', type: 'url', active: true }
      ];

      const [isSidebarOpen, setIsSidebarOpen] = useState(true);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [applicants, setApplicants] = useState([]);
      const [isLoadingData, setIsLoadingData] = useState(true);
      const [filterStatus, setFilterStatus] = useState('Semua');
      const [selectedDetail, setSelectedDetail] = useState(null);
      const [updatingIds, setUpdatingIds] = useState({});
      const [selectedRole, setSelectedRole] = useState('English Trainer');

      const [interviewModal, setInterviewModal] = useState({
        isOpen: false, app: null, type: 'online', datetime: '', location: ''
      });

      // Fixed fields are retained only for applicant table rendering.
      const [formFields] = useState(FIXED_FORM_FIELDS);

      // --- STATE PENILAIAN KOGNITIF ---
      const [kognitifQuestions, setKognitifQuestions] = useState([]);
      const [isLoadingKognitif, setIsLoadingKognitif] = useState(true);
      const [isSavingKognitif, setIsSavingKognitif] = useState(false);
      const [kognitifTab, setKognitifTab] = useState('soal');
      const [passingGrade, setPassingGrade] = useState({ rekomen: 60, sangatRekomen: 85 });
      const [isSavingGrade, setIsSavingGrade] = useState(false);
      const [hasilJawaban, setHasilJawaban] = useState([]);
      const [hasilHeaders, setHasilHeaders] = useState([]);
      const [isLoadingHasil, setIsLoadingHasil] = useState(true);

      // --- STATE INTERVIEW ---
      const [interviewQuestions, setInterviewQuestions] = useState([]);
      const [isLoadingInterview, setIsLoadingInterview] = useState(true);
      const [isSavingInterview, setIsSavingInterview] = useState(false);
      const [gradingModal, setGradingModal] = useState({ isOpen: false, app: null, answers: {} });
      const [isSubmittingGrade, setIsSubmittingGrade] = useState(false);
      const [interviewTab, setInterviewTab] = useState('soal');
      const [interviewResults, setInterviewResults] = useState([]);

      // --- STATE ONBOARDING ---
      const [onboardingTab, setOnboardingTab] = useState('editor');
      const [clauses, setClauses] = useState([]);
      const [signedList, setSignedList] = useState([]);
      const [isSavingClause, setIsSavingClause] = useState(false);

      // --- STATE ASSIGNED ADMIN EMAIL ---
      const [adminNotifications, setAdminNotifications] = useState([]);
      const [isSavingAdmins, setIsSavingAdmins] = useState(false);

      const [dialog, setDialog] = useState({
        isOpen: false, type: 'alert', title: '', message: '', onConfirm: null
      });

      useEffect(() => {
        fetchData();
        fetchAdminNotifications();
      }, []);

      useEffect(() => {
        fetchRoleBasedData(selectedRole);
      }, [selectedRole]);

      const fetchData = () => {
        setIsLoadingData(true);
        google.script.run
          .withSuccessHandler((res) => {
            if (res.success) setApplicants(res.data);
            else setDialog({ isOpen: true, type: 'alert', title: 'Peringatan', message: res.message });
            setIsLoadingData(false);
          })
          .withFailureHandler((err) => {
            setDialog({ isOpen: true, type: 'alert', title: 'Gagal', message: err.message });
            setIsLoadingData(false);
          })
          .getApplicantsData();
      };

      const fetchRoleBasedData = (role) => {
        fetchKognitifQuestions(role);
        fetchPassingGrade(role);
        fetchHasilJawaban(role);
        fetchInterviewQuestions(role);
        fetchInterviewResults(role);
        fetchOnboardingData(role);
      };

      const fetchKognitifQuestions = (role = selectedRole) => {
        setIsLoadingKognitif(true);
        google.script.run
          .withSuccessHandler((res) => {
            if (res.success) setKognitifQuestions(res.data);
            setIsLoadingKognitif(false);
          })
          .withFailureHandler(() => setIsLoadingKognitif(false))
          .getKognitifQuestions(role);
      };

      const fetchPassingGrade = (role = selectedRole) => {
        google.script.run.withSuccessHandler(res => {
          if (res.success) setPassingGrade(res.data);
        }).getPassingGrade(role);
      };

      const fetchHasilJawaban = (role = selectedRole) => {
        setIsLoadingHasil(true);
        google.script.run.withSuccessHandler(res => {
          if (res.success) {
            setHasilJawaban(res.data);
            setHasilHeaders(res.headers);
          }
          setIsLoadingHasil(false);
        }).getHasilJawaban(role);
      };

      const handleSavePassingGrade = () => {
        setIsSavingGrade(true);
        google.script.run.withSuccessHandler(res => {
          if (res.success) {
            setDialog({ isOpen: true, type: 'success', title: 'Berhasil', message: `Passing Grade ${selectedRole} berhasil diperbarui!` });
          } else {
            setDialog({ isOpen: true, type: 'alert', title: 'Gagal', message: res.message });
          }
          setIsSavingGrade(false);
        }).savePassingGrade(selectedRole, passingGrade);
      };

      const executeStatusUpdate = (app, newStatus, interviewDetails = null) => {
        const id = app['ID Pelamar'] || app.id;

        setApplicants(current =>
          current.map(item =>
            (item['ID Pelamar'] || item.id) === id
              ? { ...item, Status: newStatus }
              : item
          )
        );

        setUpdatingIds(prev => ({ ...prev, [id]: true }));

        google.script.run
          .withSuccessHandler((res) => {
            setUpdatingIds(prev => ({ ...prev, [id]: false }));

            if (!res.success) {
              setDialog({ isOpen: true, type: 'alert', title: 'Gagal', message: res.message });
              fetchData();
              return;
            }

            if (!res.emailSent) {
              setDialog({
                isOpen: true,
                type: 'alert',
                title: 'Status Tersimpan',
                message: 'Status berhasil diperbarui, tetapi email kandidat tidak terkirim: ' + (res.emailMessage || 'Email tidak tersedia.')
              });
            }
          })
          .withFailureHandler((err) => {
            setUpdatingIds(prev => ({ ...prev, [id]: false }));
            setDialog({ isOpen: true, type: 'alert', title: 'Gagal', message: err.message });
            fetchData();
          })
          .updateApplicantStatusAndNotify(id, newStatus, interviewDetails);
      };

      const handleStatusChange = (app, newStatus) => {
        if (newStatus === 'Wawancara') {
          setInterviewModal({
            isOpen: true,
            app,
            type: 'online',
            datetime: '',
            location: ''
          });
        } else {
          executeStatusUpdate(app, newStatus);
        }
      };

      const handleSendInterview = () => {
        const { app, type, datetime, location } = interviewModal;

        if (!datetime || !location.trim()) {
          setDialog({
            isOpen: true,
            type: 'alert',
            title: 'Data Belum Lengkap',
            message: 'Isi jadwal wawancara dan link/lokasi terlebih dahulu.'
          });
          return;
        }

        executeStatusUpdate(app, 'Wawancara', { type, datetime, location });

        const noWa = app['NoWA'] || app['No. WhatsApp'] || app.wa;
        if (noWa) {
          let formattedNo = noWa.toString().replace(/\D/g, '');
          if (formattedNo.startsWith('0')) formattedNo = '62' + formattedNo.substring(1);

          const formatTanggal = new Date(datetime).toLocaleString('id-ID', {
            dateStyle: 'full',
            timeStyle: 'short'
          });

          let message =
            `Halo ${app['Nama'] || 'Kandidat'}, selamat! Anda lolos ke tahap Wawancara untuk posisi ${app['Posisi'] || '-'}.\n\n` +
            `Jadwal: *${formatTanggal} WIB*\n`;

          if (type === 'online') {
            message += `Format: *Online (Google Meet)*\n🌐 Link Meeting: ${location}\n\n`;
          } else {
            message += `Format: *Tatap Muka (Offline)*\n🏢 Lokasi/Alamat: ${location}\n\n`;
          }

          message += 'Harap konfirmasi kehadiran Anda dengan membalas pesan ini. Terima kasih.';
          window.open(`https://wa.me/${formattedNo}?text=${encodeURIComponent(message)}`, '_blank');
        }

        setInterviewModal({ isOpen: false, app: null, type: 'online', datetime: '', location: '' });
      };

      const getStatusColorClass = (status) => {
        switch(status) {
          case 'Baru': return 'bg-blue-50 text-blue-700 border-blue-200';
          case 'Penilaian Cognitive': return 'bg-purple-50 text-purple-700 border-purple-200';
          case 'Selesai Test Kognitif': return 'bg-indigo-100 text-indigo-800 border-indigo-300';
          case 'Wawancara': return 'bg-yellow-50 text-yellow-700 border-yellow-200';
          case 'Sudah Wawancara': return 'bg-amber-100 text-amber-800 border-amber-300';
          case 'Onboarding': return 'bg-orange-50 text-orange-700 border-orange-200';
          case 'Active': return 'bg-green-50 text-green-700 border-green-200';
          default: return 'bg-gray-50 text-gray-700 border-gray-200';
        }
      };

      const handleAddQuestion = () => {
        const newId = kognitifQuestions.length > 0
          ? Math.max(...kognitifQuestions.map(q => Number(q.id) || 0)) + 1
          : 1;

        setKognitifQuestions([
          ...kognitifQuestions,
          { id: newId, question: '', optionA: '', optionB: '', optionC: '', optionD: '', scoreA: 1, scoreB: 2, scoreC: 3, scoreD: 4 }
        ]);
      };

      const handleUpdateQuestion = (id, key, value) => {
        setKognitifQuestions(
          kognitifQuestions.map(q => q.id === id ? { ...q, [key]: value } : q)
        );
      };

      const handleDeleteQuestion = (id) => {
        setDialog({
          isOpen: true,
          type: 'confirm',
          title: 'Hapus Soal?',
          message: `Hapus soal ini dari template ${selectedRole}?`,
          onConfirm: () => setKognitifQuestions(kognitifQuestions.filter(q => q.id !== id))
        });
      };

      const handleSaveKognitif = () => {
        setIsSavingKognitif(true);
        google.script.run.withSuccessHandler((res) => {
          setIsSavingKognitif(false);

          if (res.success) {
            setDialog({ isOpen: true, type: 'success', title: 'Berhasil', message: `Soal kognitif ${selectedRole} tersimpan!` });
          } else {
            setDialog({ isOpen: true, type: 'alert', title: 'Gagal', message: res.message });
          }
        }).saveKognitifQuestions(selectedRole, kognitifQuestions);
      };

      const fetchInterviewQuestions = (role = selectedRole) => {
        setIsLoadingInterview(true);
        google.script.run.withSuccessHandler(res => {
          if (res.success) setInterviewQuestions(res.data);
          setIsLoadingInterview(false);
        }).getInterviewQuestions(role);
      };

      const handleAddInterviewQ = () => {
        const newId = interviewQuestions.length > 0
          ? Math.max(...interviewQuestions.map(q => Number(q.id) || 0)) + 1
          : 1;

        setInterviewQuestions([
          ...interviewQuestions,
          { id: newId, question: 'Ketik pertanyaan wawancara baru...' }
        ]);
      };

      const handleUpdateInterviewQ = (id, val) => {
        setInterviewQuestions(
          interviewQuestions.map(q => q.id === id ? { ...q, question: val } : q)
        );
      };

      const handleDeleteInterviewQ = (id) => {
        setDialog({
          isOpen: true,
          type: 'confirm',
          title: 'Hapus Pertanyaan?',
          message: `Hapus pertanyaan wawancara ${selectedRole} ini?`,
          onConfirm: () => setInterviewQuestions(interviewQuestions.filter(q => q.id !== id))
        });
      };

      const handleSaveInterviewQs = () => {
        setIsSavingInterview(true);
        google.script.run.withSuccessHandler(res => {
          setIsSavingInterview(false);

          if (res.success) {
            setDialog({ isOpen: true, type: 'success', title: 'Berhasil', message: `Pertanyaan wawancara ${selectedRole} disimpan!` });
          } else {
            setDialog({ isOpen: true, type: 'alert', title: 'Gagal', message: res.message });
          }
        }).saveInterviewQuestions(selectedRole, interviewQuestions);
      };

      const handleOpenGrading = (app) => {
        const initAns = {};
        interviewQuestions.forEach(q => initAns[q.id] = 0);
        setGradingModal({ isOpen: true, app, answers: initAns });
      };

      const fetchInterviewResults = (role = selectedRole) => {
        google.script.run.withSuccessHandler(res => {
          if (res.success) setInterviewResults(res.data);
        }).getInterviewResults(role);
      };

      const fetchOnboardingData = (role = selectedRole) => {
        google.script.run.withSuccessHandler(res => {
          if (res.success) setClauses(res.data);
        }).getOnboardingClauses(role);

        google.script.run.withSuccessHandler(res => {
          if (res.success) setSignedList(res.data);
        }).getOnboardingSignatures(role);
      };

      const handleScoreChange = (qId, score) => {
        setGradingModal(prev => ({
          ...prev,
          answers: { ...prev.answers, [qId]: score }
        }));
      };

      const handleSubmitGrading = () => {
        setIsSubmittingGrade(true);

        const total = Object.values(gradingModal.answers)
          .reduce((sum, value) => sum + Number(value || 0), 0);

        google.script.run.withSuccessHandler(res => {
          setIsSubmittingGrade(false);

          if (res.success) {
            setDialog({
              isOpen: true,
              type: 'success',
              title: 'Nilai Tersimpan!',
              message: `Total Skor Kandidat: ${total}`
            });

            setGradingModal({ isOpen: false, app: null, answers: {} });
            fetchInterviewResults(selectedRole);
            fetchData();
          } else {
            setDialog({ isOpen: true, type: 'alert', title: 'Gagal', message: res.message });
          }
        }).submitInterviewResult(
          gradingModal.app['ID Pelamar'] || gradingModal.app.id,
          gradingModal.app['Nama'] || gradingModal.app.name,
          gradingModal.app['Posisi'] || gradingModal.app.posisi,

                  </div>
                </div>

                <div className="flex justify-around items-center py-6 border-y border-gray-100 my-4 bg-gray-50 rounded-xl">
                  <CircularProgress percentage={kogScore} label="Kognitif" colorClass="text-purple-500" />
                  <CircularProgress percentage={intPercentage} label="Wawancara" colorClass="text-blue-500" />
                  <CircularProgress percentage={finalScore} label="Rata-rata" colorClass={finalScore >= 75 ? 'text-green-500' : finalScore >= 50 ? 'text-yellow-500' : 'text-red-500'} />
                </div>

                <div className="mt-auto pt-2">
                  <div className="flex items-center justify-between text-xs font-bold mb-3">
                    <span className="text-gray-500">Status Saat Ini:</span>
                    <span className={`px-3 py-1 rounded-full ${app['Status'] === 'Active' ? 'bg-green-100 text-green-700' : 'bg-gray-200 text-gray-700'}`}>{app['Status']}</span>
                  </div>
                  <button onClick={() => setSelectedDetail({ 
                    id: appId, 
                    title: `Detail Assessment: ${app['Nama']}`, 
                    content: `Rincian Nilai Kandidat:\n\n1. Nilai Kognitif: ${kogScore}%\n2. Nilai Wawancara: ${intScoreRaw}/${maxIntScore} (Setara ${intPercentage}%)\n\n🏆 RATA-RATA KESELURUHAN: ${finalScore}%` 
                  })} className="w-full py-3 bg-black hover:bg-red-600 text-white text-xs font-bold rounded-xl transition shadow-md">
                    Lihat Detail Analitik
                  </button>
                </div>
              </div>
            );
          })
        )}
      </div>
    </div>
  );

  return (
    <div className="min-h-screen flex bg-gray-100 overflow-hidden">
      
      <aside className={`bg-black text-white flex flex-col shadow-2xl z-20 transition-all duration-300 ease-in-out ${isSidebarOpen ? 'w-64' : 'w-0 overflow-hidden opacity-0 md:opacity-100 md:w-0'}`}>
        <div className="p-6 border-b border-gray-800 flex items-center space-x-3 w-64">
          <div className="w-10 h-10 bg-red-600 rounded flex items-center justify-center font-bold text-xl">A</div>
          <div><h1 className="font-bold">ADMIN</h1><p className="text-xs text-gray-400">Portal Rekrutmen</p></div>
        </div>
        <nav className="flex-1 py-6 px-4 space-y-2 w-64">
          <button onClick={() => setActiveTab('dashboard')} className={`w-full text-left px-4 py-3 rounded-xl ${activeTab === 'dashboard' ? 'bg-red-600 text-white' : 'text-gray-400 hover:bg-gray-800'}`}>📊 Dashboard Utama</button>
          <button onClick={() => setActiveTab('kognitif_builder')} className={`w-full text-left px-4 py-3 rounded-xl ${activeTab === 'kognitif_builder' ? 'bg-red-600 text-white' : 'text-gray-400 hover:bg-gray-800'}`}>🧠 Penilaian Kognitif</button>
          <button onClick={() => setActiveTab('interview')} className={`w-full text-left px-4 py-3 rounded-xl ${activeTab === 'interview' ? 'bg-red-600 text-white' : 'text-gray-400 hover:bg-gray-800'}`}>🗣️ Penilaian Wawancara</button>
          <button onClick={() => setActiveTab('onboarding')} className={`w-full text-left px-4 py-3 rounded-xl ${activeTab === 'onboarding' ? 'bg-red-600 text-white' : 'text-gray-400 hover:bg-gray-800'}`}>
            🤝 Onboarding
          </button>
          <button onClick={() => setActiveTab('notifications')} className={`w-full text-left px-4 py-3 rounded-xl ${activeTab === 'notifications' ? 'bg-red-600 text-white' : 'text-gray-400 hover:bg-gray-800'}`}>
            ✉️ Assigned Admin Email
          </button>
          <button onClick={() => setActiveTab('recap')} className={`w-full text-left px-4 py-3 rounded-xl ${activeTab === 'recap' ? 'bg-red-600 text-white' : 'text-gray-400 hover:bg-gray-800'}`}>
            📈 Overall Recap
          </button>
        </nav>
        <div className="p-4 border-t border-gray-800 w-64">
          <button onClick={handleLogout} className="w-full py-3 bg-gray-900 hover:bg-red-600 rounded-xl text-sm font-bold">Keluar Sistem</button>
        </div>
      </aside>

      <div className="flex-1 flex flex-col h-screen overflow-hidden">
        <header className="bg-white border-b border-gray-200 py-4 px-6 flex justify-between items-center shadow-sm z-10">
          <div className="flex items-center">
            <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="mr-4 text-gray-600 hover:text-red-600 focus:outline-none transition transform hover:scale-110">
              <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <h1 className="text-xl font-bold tracking-wide text-gray-800">HR PORTAL</h1>
          </div>
          <div className="flex items-center space-x-3">
            <span className="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-sm font-bold text-gray-600">HR</span>
          </div>
        </header>

        <div className="flex-1 overflow-y-auto p-4 md:p-8 w-full max-w-7xl mx-auto">
          {activeTab === 'dashboard' ? renderDashboard() :
           activeTab === 'kognitif_builder' ? renderKognitifMaster() :
           activeTab === 'interview' ? renderInterviewMaster() :
           activeTab === 'onboarding' ? renderOnboardingMaster() :
           activeTab === 'notifications' ? renderAdminNotifications() :
           renderRecapMaster()}
        </div>
      </div>

      {selectedDetail && (
        <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg relative p-6">
            <button onClick={() => setSelectedDetail(null)} className="absolute top-4 right-4 text-gray-400 hover:text-red-600 font-bold text-xl transition">×</button>
            <h3 className="text-xl font-bold mb-1">{selectedDetail.title}</h3>
            <p className="text-sm text-gray-500 mb-4 border-b pb-2">ID: {selectedDetail.id}</p>
            <div className="bg-gray-50 p-4 rounded-lg border text-sm leading-relaxed whitespace-pre-wrap">{selectedDetail.content}</div>
          </div>
        </div>
      )}

      {/* TARUH MODAL WAWANCARA DI SINI WAK 👇 */}
      {interviewModal.isOpen && (
        <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 animate-[fadeIn_0.2s_ease-out]">
            <div className="flex justify-between items-center mb-6 border-b pb-4">
              <div>
                <h3 className="text-xl font-bold text-gray-900">Atur Jadwal Wawancara</h3>
                <p className="text-sm text-gray-500">Kandidat: <span className="font-bold text-black">{interviewModal.app['Nama'] || 'Kandidat'}</span></p>
              </div>
              <button onClick={() => setInterviewModal({...interviewModal, isOpen: false})} className="text-gray-400 hover:text-red-600 font-bold text-2xl">×</button>
            </div>

            <div className="space-y-4">
              <div>
                <label className="block text-xs font-bold uppercase text-gray-500 mb-2">Format Wawancara</label>
                <div className="flex space-x-4">
                  <label className={`flex-1 py-3 px-4 border rounded-xl cursor-pointer font-bold text-sm flex items-center justify-center gap-2 transition ${interviewModal.type === 'online' ? 'bg-blue-50 border-blue-500 text-blue-700' : 'bg-gray-50 border-gray-200 text-gray-500 hover:bg-gray-100'}`}>
                    <input type="radio" name="intType" checked={interviewModal.type === 'online'} onChange={() => setInterviewModal({...interviewModal, type: 'online'})} className="hidden" />
                    🌐 Online
                  </label>
                  <label className={`flex-1 py-3 px-4 border rounded-xl cursor-pointer font-bold text-sm flex items-center justify-center gap-2 transition ${interviewModal.type === 'offline' ? 'bg-green-50 border-green-500 text-green-700' : 'bg-gray-50 border-gray-200 text-gray-500 hover:bg-gray-100'}`}>
                    <input type="radio" name="intType" checked={interviewModal.type === 'offline'} onChange={() => setInterviewModal({...interviewModal, type: 'offline'})} className="hidden" />
                    🏢 Offline
                  </label>
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold uppercase text-gray-500 mb-1">Tanggal & Waktu</label>
                <input type="datetime-local" value={interviewModal.datetime} onChange={(e) => setInterviewModal({...interviewModal, datetime: e.target.value})} className="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:border-red-500" required />
              </div>

              <div>
                <label className="block text-xs font-bold uppercase text-gray-500 mb-1">
                  {interviewModal.type === 'online' ? 'Link Google Meet / Zoom' : 'Alamat Lengkap Kantor'}
                </label>
                <textarea 
                  value={interviewModal.location} 
                  onChange={(e) => setInterviewModal({...interviewModal, location: e.target.value})} 
                  className="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:border-red-500 resize-none" 
                  rows="3" 
                  placeholder={interviewModal.type === 'online' ? 'https://meet.google.com/xxx-xxxx-xxx' : 'Jl. Sudirman No. 123, Gedung Indah Lantai 4...'} 
                  required 
                ></textarea>
              </div>
            </div>

            <div className="mt-8 flex gap-3">
              <button onClick={() => setInterviewModal({...interviewModal, isOpen: false})} className="flex-1 py-3 bg-gray-100 text-gray-800 font-bold rounded-xl hover:bg-gray-200 transition">Batal</button>
              <button onClick={handleSendInterview} className="flex-1 py-3 bg-black text-white font-bold rounded-xl hover:bg-red-600 transition shadow-md">
                Simpan & Kirim WA
              </button>
            </div>
          </div>
        </div>
      )}
      {/* 👆 BATAS MODAL WAWANCARA */}

      {/* MODAL LIVE GRADING WAWANCARA */}
      {gradingModal.isOpen && (
        <div className="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl flex flex-col max-h-[90vh] animate-[fadeIn_0.2s_ease-out]">
            <div className="p-6 border-b flex justify-between items-center bg-blue-50 rounded-t-2xl">
              <div>
                <h3 className="text-xl font-bold text-blue-900">Form Penilaian Wawancara</h3>
                <p className="text-sm text-blue-700">Kandidat: <span className="font-bold">{gradingModal.app['Nama'] || 'Kandidat'}</span></p>
              </div>
              <button onClick={() => setGradingModal({ isOpen: false, app: null, answers: {} })} className="text-blue-400 hover:text-blue-800 font-bold text-2xl">×</button>
            </div>
            
            <div className="p-6 overflow-y-auto flex-1 space-y-6">
              {interviewQuestions.map((q, idx) => (
                <div key={q.id} className="border-b pb-4 last:border-0">
                  <p className="font-bold text-gray-800 mb-3 text-sm">{idx + 1}. {q.question}</p>
                  <div className="flex gap-2">
                    <button onClick={() => handleScoreChange(q.id, 1)} className={`flex-1 py-2 rounded-lg text-xs font-bold border transition ${gradingModal.answers[q.id] === 1 ? 'bg-red-500 text-white border-red-500 shadow-inner' : 'bg-white text-gray-600 hover:bg-gray-50 border-gray-300'}`}>1 - Tidak Relevan</button>
                    <button onClick={() => handleScoreChange(q.id, 2)} className={`flex-1 py-2 rounded-lg text-xs font-bold border transition ${gradingModal.answers[q.id] === 2 ? 'bg-yellow-500 text-white border-yellow-500 shadow-inner' : 'bg-white text-gray-600 hover:bg-gray-50 border-gray-300'}`}>2 - Relevan</button>
                    <button onClick={() => handleScoreChange(q.id, 3)} className={`flex-1 py-2 rounded-lg text-xs font-bold border transition ${gradingModal.answers[q.id] === 3 ? 'bg-green-500 text-white border-green-500 shadow-inner' : 'bg-white text-gray-600 hover:bg-gray-50 border-gray-300'}`}>3 - Sangat Relevan</button>
                  </div>
                </div>
              ))}
            </div>

            <div className="p-6 border-t bg-gray-50 rounded-b-2xl flex gap-4">
              <div className="flex-1 flex items-center justify-between px-4 bg-white rounded-xl border border-gray-200">
                <span className="text-xs font-bold text-gray-500 uppercase">Total Skor Sementara</span>
                <span className="text-xl font-black text-blue-600">{Object.values(gradingModal.answers).reduce((a, b) => a + b, 0)}</span>
              </div>
              <button onClick={handleSubmitGrading} disabled={isSubmittingGrade} className={`px-8 py-3 text-white font-bold rounded-xl transition shadow-md ${isSubmittingGrade ? 'bg-gray-400' : 'bg-blue-600 hover:bg-blue-700'}`}>
                {isSubmittingGrade ? 'Menyimpan...' : 'Simpan Nilai'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* KOMPONEN MODAL POP-UP CUSTOM ANTI BURIQ */}
      {dialog.isOpen && (
        <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[60] p-4">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 text-center animate-[fadeIn_0.2s_ease-out]">
            <div className={`w-16 h-16 rounded-full mx-auto mb-4 flex items-center justify-center text-3xl ${dialog.type === 'confirm' ? 'bg-yellow-100 text-yellow-600' : dialog.type === 'success' ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}`}>
              {dialog.type === 'confirm' ? '❓' : dialog.type === 'success' ? '✅' : '⚠️'}
            </div>
            <h3 className="text-xl font-bold mb-2 text-gray-900">{dialog.title}</h3>
            <p className="text-gray-600 mb-6 text-sm">{dialog.message}</p>
            <div className="flex justify-center gap-3">
              {dialog.type === 'confirm' && (
                <button onClick={() => setDialog({ ...dialog, isOpen: false })} className="px-5 py-2 bg-gray-100 text-gray-800 font-bold rounded-xl hover:bg-gray-200 transition">Batal</button>
              )}
              <button onClick={() => { setDialog({ ...dialog, isOpen: false }); if(dialog.onConfirm) dialog.onConfirm(); }} className="px-5 py-2 bg-black text-white font-bold rounded-xl hover:bg-gray-800 transition shadow-md">
                {dialog.type === 'confirm' ? 'Ya, Lanjutkan' : 'Tutup'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AdminDashboard />);

  </script>
</body>
</html>
