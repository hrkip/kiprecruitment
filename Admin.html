<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Admin Dashboard KIP</title>
  <script>
    window.KIP_GAS_API_URL = 'https://script.google.com/macros/s/AKfycbye10iCJKYg-GRxtmD0SUgbkaLPb7w9XDPN2BSCtRjPHinDTxCd7wzkoXrV4_Gf6ZvC/exec';
  </script>
  <script src="./kip-api.js"></script>
  <style>
    :root {
      --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --surface:#fff; --canvas:#f3f4f6;
      --red:#c81e1e; --red-dark:#991b1b; --blue:#2563eb; --green:#059669; --amber:#d97706;
      --purple:#7c3aed; --shadow:0 14px 36px rgba(17,24,39,.08); --radius:16px;
    }
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
    button,input,select,textarea{font:inherit} button{border:0;cursor:pointer}.hidden{display:none!important}
    .app{height:100vh;display:flex;overflow:hidden}.sidebar{width:258px;flex:0 0 258px;background:#090d16;color:#fff;display:flex;flex-direction:column;transition:margin .2s ease,transform .2s ease;box-shadow:14px 0 40px rgba(17,24,39,.12);z-index:30}.sidebar.closed{margin-left:-258px}
    .sidebar-head{height:78px;padding:18px 20px;border-bottom:1px solid #202633;display:flex;align-items:center;gap:12px}.brand-mark{width:42px;height:42px;border-radius:13px;background:var(--red);display:grid;place-items:center;font-weight:900}.brand-copy strong{display:block}.brand-copy span{font-size:12px;color:#9ca3af}
    .nav{padding:18px 12px;display:grid;gap:7px;flex:1;overflow:auto}.nav-btn{width:100%;padding:13px 14px;border-radius:12px;background:transparent;color:#aeb6c4;text-align:left;font-weight:750;transition:.15s}.nav-btn:hover{background:#171d29;color:#fff}.nav-btn.active{background:var(--red);color:#fff}.sidebar-foot{padding:14px;border-top:1px solid #202633}.logout{width:100%;padding:12px;border-radius:11px;background:#171d29;color:white;font-weight:800}.logout:hover{background:var(--red)}
    .workspace{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:70px;flex:0 0 70px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;box-shadow:0 3px 16px rgba(17,24,39,.04);z-index:20}.top-left{display:flex;align-items:center;gap:13px}.menu-btn{width:42px;height:42px;border-radius:12px;background:#f3f4f6;color:#374151;font-size:20px}.top-title{font-size:18px;font-weight:900;letter-spacing:.04em}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#e5e7eb;font-weight:900;color:#4b5563}.content{flex:1;overflow:auto;padding:26px}.content-inner{width:min(100%,1400px);margin:0 auto}
    .page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}.page-head h1{margin:0;font-size:27px;letter-spacing:-.035em}.page-head p{margin:7px 0 0;color:var(--muted);font-size:14px}.role-select{min-width:190px;padding:10px 12px;border:1px solid #d1d5db;border-radius:11px;background:#fff;font-weight:800;outline:none}
    .btn{min-height:42px;padding:10px 15px;border-radius:11px;font-weight:850;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .15s ease,opacity .15s ease,background .15s ease}.btn:hover:not(:disabled){transform:translateY(-1px)}.btn:disabled{opacity:.55;cursor:wait}.btn-dark{background:var(--ink);color:#fff}.btn-red{background:var(--red);color:#fff}.btn-blue{background:var(--blue);color:#fff}.btn-green{background:var(--green);color:#fff}.btn-light{background:#fff;color:#374151;border:1px solid #d1d5db}.btn-danger{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}.stat{padding:21px;border-left:4px solid var(--ink)}.stat.blue{border-color:#3b82f6}.stat.amber{border-color:#f59e0b}.stat.green{border-color:#10b981}.stat span{display:block;color:var(--muted);font-size:12px;font-weight:850;text-transform:uppercase;letter-spacing:.05em}.stat strong{display:block;margin-top:8px;font-size:30px}
    .card-head{padding:18px 20px;border-bottom:1px solid var(--line);background:#fafafa;display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.card-head h2{margin:0;font-size:18px}.table-wrap{overflow:auto;min-height:250px}.table{width:100%;border-collapse:collapse;min-width:1050px}.table th,.table td{padding:13px 14px;border-bottom:1px solid #f0f1f3;text-align:left;vertical-align:top;white-space:nowrap}.table th{position:sticky;top:0;background:#f9fafb;color:#6b7280;font-size:11px;text-transform:uppercase;letter-spacing:.05em;z-index:4}.table tr:hover td{background:#fff7f7}.table .sticky{position:sticky;left:0;background:white;z-index:3;box-shadow:1px 0 #e5e7eb}.table th.sticky{background:#f9fafb;z-index:5}.tiny{font-size:11px;color:var(--muted)}.small{font-size:13px}.nowrap{white-space:nowrap}.truncate{max-width:220px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}.tag{display:inline-flex;padding:5px 9px;border-radius:8px;background:#f3f4f6;border:1px solid #e5e7eb;font-size:11px;font-weight:800}.link{display:inline-flex;padding:7px 10px;background:#111827;color:white;border-radius:8px;text-decoration:none;font-size:11px;font-weight:800}.link:hover{background:var(--red)}
    .status-select{padding:7px 9px;border-radius:8px;border:1px solid;font-size:11px;font-weight:850;outline:none}.status-Baru{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}.status-Penilaian-Cognitive{background:#f5f3ff;color:#6d28d9;border-color:#ddd6fe}.status-Selesai-Test-Kognitif{background:#eef2ff;color:#4338ca;border-color:#c7d2fe}.status-Wawancara,.status-Sudah-Wawancara{background:#fffbeb;color:#b45309;border-color:#fde68a}.status-Onboarding{background:#fff7ed;color:#c2410c;border-color:#fed7aa}.status-Active{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
    .tabs{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:#e5e7eb;margin-bottom:20px}.tab-btn{padding:9px 16px;border-radius:9px;background:transparent;color:#6b7280;font-weight:850}.tab-btn.active{background:white;color:#111827;box-shadow:0 2px 8px rgba(17,24,39,.08)}
    .panel{padding:20px}.editor-list{display:grid;gap:15px}.editor-item{padding:18px;border:1px solid var(--line);border-radius:14px;background:#fafafa}.editor-head{display:flex;gap:12px;align-items:flex-start}.number{width:32px;height:32px;flex:0 0 32px;border-radius:9px;display:grid;place-items:center;background:#111827;color:#fff;font-weight:900}.input,.textarea,.select{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:10px 12px;background:white;outline:none}.input:focus,.textarea:focus,.select:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(200,30,30,.08)}.textarea{min-height:80px;resize:vertical}.options-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0 0 44px}.option-edit{display:grid;grid-template-columns:1fr 75px;gap:8px}.option-edit label{font-size:11px;font-weight:800;color:#6b7280}.option-edit .field{display:grid;gap:5px}.delete-row{display:flex;justify-content:flex-end;margin-top:10px}.add-dashed{width:100%;padding:14px;border:2px dashed #d1d5db;border-radius:12px;background:white;color:#6b7280;font-weight:850}.add-dashed:hover{border-color:var(--red);color:var(--red)}
    .grade-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:760px}.grade-box{padding:18px;border-radius:14px;border:1px solid}.grade-box.blue{background:#eff6ff;border-color:#bfdbfe}.grade-box.green{background:#ecfdf5;border-color:#a7f3d0}.grade-box label{display:block;font-weight:900;margin-bottom:10px}.grade-value{display:flex;align-items:center;gap:8px}.grade-value input{width:100px;text-align:center;font-size:19px;font-weight:900}
    .candidate-list{display:grid;gap:10px}.candidate-row{display:grid;grid-template-columns:1.1fr 1.5fr 1fr .8fr 1fr;gap:12px;align-items:center;padding:14px;border-bottom:1px solid #f0f1f3}.candidate-row.header{background:#fafafa;color:#6b7280;text-transform:uppercase;font-size:11px;font-weight:850}.candidate-row:last-child{border-bottom:0}.score{font-weight:950;color:#1d4ed8;text-align:center}
    .clause-list{display:grid;gap:13px}.clause{padding:16px;border:1px solid var(--line);border-radius:13px;background:#fafafa}.notice{padding:14px 16px;border-radius:12px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;font-size:13px;line-height:1.6;margin-bottom:18px}.notification-table{min-width:900px}.check{width:18px;height:18px;accent-color:var(--green)}
    .recap-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.recap-card{padding:19px}.recap-card h3{margin:0;font-size:18px}.progress-row{display:flex;justify-content:space-around;gap:10px;padding:20px 6px;margin:15px 0;background:#fafafa;border-radius:14px;border:1px solid #f0f1f3}.progress{display:grid;justify-items:center;gap:7px}.ring{--p:0;--ring:#7c3aed;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ring) calc(var(--p)*1%),#e5e7eb 0);position:relative}.ring:before{content:"";position:absolute;inset:8px;background:white;border-radius:50%}.ring strong{position:relative;font-size:14px}.progress span{font-size:10px;font-weight:850;text-transform:uppercase;color:#6b7280}
    .loading{min-height:340px;display:grid;place-items:center}.loading-box{text-align:center;color:#6b7280}.spinner{width:40px;height:40px;margin:0 auto 13px;border:4px solid #e5e7eb;border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.empty{padding:42px;text-align:center;color:#6b7280}
    .backdrop{position:fixed;inset:0;z-index:100;background:rgba(17,24,39,.68);display:grid;place-items:center;padding:18px}.modal{width:min(100%,480px);max-height:92vh;overflow:auto;background:white;border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.28)}.modal.wide{width:min(100%,760px)}.modal-head{padding:19px 21px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.modal-head h2{margin:0;font-size:21px}.modal-head p{margin:4px 0 0;color:var(--muted);font-size:13px}.close{background:transparent;color:#9ca3af;font-size:26px}.modal-body{padding:21px}.modal-foot{padding:17px 21px;background:#fafafa;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}.dialog{text-align:center;padding:26px}.dialog-icon{width:66px;height:66px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:#fee2e2;color:#b91c1c}.dialog-icon.confirm{background:#fef3c7;color:#b45309}.dialog-icon.success{background:#d1fae5;color:#047857}.dialog h2{margin:0}.dialog p{color:var(--muted);line-height:1.6}.radio-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.radio-choice{padding:13px;border:1px solid var(--line);border-radius:11px;text-align:center;font-weight:850;cursor:pointer}.radio-choice.active{background:#eff6ff;border-color:#3b82f6;color:#1d4ed8}.grading-list{display:grid;gap:15px}.grading-item{padding-bottom:15px;border-bottom:1px solid var(--line)}.grading-item p{font-weight:850;line-height:1.5}.score-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.score-btn{padding:9px;border-radius:9px;border:1px solid #d1d5db;background:white;font-size:11px;font-weight:850}.score-btn.s1.active{background:#ef4444;color:white;border-color:#ef4444}.score-btn.s2.active{background:#eab308;color:white;border-color:#eab308}.score-btn.s3.active{background:#10b981;color:white;border-color:#10b981}
    @media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.recap-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:760px){body{overflow:auto}.app{min-height:100vh;height:auto}.sidebar{position:fixed;inset:0 auto 0 0}.sidebar.closed{margin-left:0;transform:translateX(-100%)}.workspace{min-height:100vh}.content{padding:16px}.page-head{align-items:stretch;flex-direction:column}.stats,.grade-grid,.recap-grid{grid-template-columns:1fr}.options-grid{grid-template-columns:1fr;margin-left:0}.candidate-row{grid-template-columns:1fr;gap:5px}.candidate-row.header{display:none}.radio-grid,.score-buttons{grid-template-columns:1fr}.topbar{padding:0 14px}}
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head"><div class="brand-mark">A</div><div class="brand-copy"><strong>ADMIN</strong><span>Portal Rekrutmen</span></div></div>
      <nav class="nav" id="main-nav">
        <button class="nav-btn active" data-tab="dashboard">📊 Dashboard Utama</button>
        <button class="nav-btn" data-tab="cognitive">🧠 Penilaian Kognitif</button>
        <button class="nav-btn" data-tab="interview">🗣️ Penilaian Wawancara</button>
        <button class="nav-btn" data-tab="onboarding">🤝 Onboarding</button>
        <button class="nav-btn" data-tab="notifications">✉️ Assigned Admin Email</button>
        <button class="nav-btn" data-tab="recap">📈 Overall Recap</button>
      </nav>
      <div class="sidebar-foot"><button id="logout" class="logout">Keluar Sistem</button></div>
    </aside>

    <section class="workspace">
      <header class="topbar"><div class="top-left"><button id="menu" class="menu-btn">☰</button><div class="top-title">HR PORTAL</div></div><div class="avatar">HR</div></header>
      <main class="content"><div id="view" class="content-inner"><div class="loading"><div class="loading-box"><div class="spinner"></div><strong>Memuat dashboard...</strong></div></div></div></main>
    </section>
  </div>
  <div id="modal-root"></div>

  <script>
    (function(){
      'use strict';

      const ROLES=['English Trainer','Admin','Team Leader'];
      const STATUSES=['Baru','Penilaian Cognitive','Selesai Test Kognitif','Wawancara','Sudah Wawancara','Onboarding','Active'];
      const FIELDS=[
        ['Nama','Full Name','text'],['Alamat','Address','textarea'],['Email','Email','text'],['NoWA','WA Number','tel'],['Social Media','Social Media','text'],['Posisi','Position Applied','select'],['TeachingAudience','Teaching Audience','text'],['Proficiency Level','Proficiency Level','select'],['Certificate','Certificate','link'],['CV','CV','link'],['Portofolio','Portfolio / LinkedIn','link']
      ];
      const state={
        tab:'dashboard',sidebar:true,applicants:[],dashboardLoaded:false,dashboardLoading:false,filterStatus:'Semua',
        role:'English Trainer',roleData:{},roleLoading:{},notifications:[],notificationsLoaded:false,
        cognitiveTab:'questions',interviewTab:'questions',onboardingTab:'editor',updating:{},dialog:null,
        selectedDetail:null,interviewModal:null,gradingModal:null
      };
      const view=document.getElementById('view');
      const modalRoot=document.getElementById('modal-root');
      const esc=value=>String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
      const statusClass=status=>'status-'+String(status||'Baru').replace(/\s+/g,'-');
      const roleKey=(role,section)=>role+'|'+section;
      const getRole=()=>state.roleData[state.role]||(state.roleData[state.role]={});
      const activeApplicants=()=>state.applicants.filter(a=>a['ID Pelamar']);
      const errorText=e=>e&&e.message?e.message:String(e||'Terjadi kesalahan.');
      const api=(action,...args)=>KIP_API.call(action,...args);

      function loading(message){return `<div class="loading"><div class="loading-box"><div class="spinner"></div><strong>${esc(message||'Memuat data...')}</strong></div></div>`}
      function empty(message){return `<div class="empty">${esc(message)}</div>`}
      function roleSelect(){return `<select class="role-select" data-action="role-change">${ROLES.map(r=>`<option ${r===state.role?'selected':''}>${esc(r)}</option>`).join('')}</select>`}
      function pageHead(title,subtitle,extra=''){return `<div class="page-head"><div><h1>${title}</h1><p>${subtitle}</p></div>${extra}</div>`}
      function showDialog(type,title,message,onConfirm){state.dialog={type,title,message,onConfirm};renderModal()}
      function closeModal(){if(state.dialog){state.dialog=null;renderModal();return}if(state.selectedDetail){state.selectedDetail=null;modalRoot.innerHTML='';return}if(state.interviewModal){state.interviewModal=null;modalRoot.innerHTML='';render();return}if(state.gradingModal){state.gradingModal=null;modalRoot.innerHTML='';render();return}modalRoot.innerHTML=''}

      async function loadDashboard(force=false){
        if(state.dashboardLoading||(!force&&state.dashboardLoaded))return;
        state.dashboardLoading=true;if(state.tab==='dashboard')view.innerHTML=loading('Memuat data pelamar...');
        try{const r=await api('getAdminDashboardBundle');if(!r||!r.success)throw new Error(r?.message||'Data gagal dimuat.');state.applicants=r.data?.applicants||[];state.dashboardLoaded=true}
        catch(e){showDialog('alert','Gagal Memuat',errorText(e))}
        finally{state.dashboardLoading=false;render()}
      }

      async function loadRoleSection(section,force=false){
        const key=roleKey(state.role,section);const data=getRole();
        if(state.roleLoading[key]||(!force&&data['_loaded_'+section]))return;
        state.roleLoading[key]=true;render();
        try{const r=await api('getAdminRoleBundle',state.role,section);if(!r||!r.success)throw new Error(r?.message||'Data modul gagal dimuat.');Object.assign(data,r.data||{});data['_loaded_'+section]=true}
        catch(e){showDialog('alert','Gagal Memuat',errorText(e))}
        finally{state.roleLoading[key]=false;render()}
      }

      async function loadNotifications(force=false){
        if(!force&&state.notificationsLoaded)return;view.innerHTML=loading('Memuat daftar admin...');
        try{const r=await api('getAdminNotifications');if(!r||!r.success)throw new Error(r?.message||'Data gagal dimuat.');state.notifications=r.data||[];state.notificationsLoaded=true}
        catch(e){showDialog('alert','Gagal Memuat',errorText(e))}finally{render()}
      }

      function ensureTabData(){
        if(state.tab==='dashboard')loadDashboard();
        else if(state.tab==='cognitive')loadRoleSection('cognitive');
        else if(state.tab==='interview')loadRoleSection('interview');
        else if(state.tab==='onboarding')loadRoleSection('onboarding');
        else if(state.tab==='notifications')loadNotifications();
        else if(state.tab==='recap'){loadDashboard();loadRoleSection('recap')}
      }

      function render(){
        document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));
        if(state.tab==='dashboard')renderDashboard();
        else if(state.tab==='cognitive')renderCognitive();
        else if(state.tab==='interview')renderInterview();
        else if(state.tab==='onboarding')renderOnboarding();
        else if(state.tab==='notifications')renderNotifications();
        else renderRecap();
      }

      function renderDashboard(){
        if(!state.dashboardLoaded){view.innerHTML=loading('Memuat data pelamar...');return}
        const apps=activeApplicants();const filtered=state.filterStatus==='Semua'?apps:apps.filter(a=>(a.Status||'Baru')===state.filterStatus);
        const processing=apps.filter(a=>['Penilaian Cognitive','Selesai Test Kognitif','Wawancara','Sudah Wawancara','Onboarding'].includes(a.Status)).length;
        view.innerHTML=pageHead('Overview Rekrutmen','Kelola dan update status pelamar secara real-time.',`<button class="btn btn-dark" data-action="refresh-dashboard">↻ Refresh Data</button>`)+
        `<section class="stats"><div class="card stat"><span>Total Pelamar</span><strong>${apps.length}</strong></div><div class="card stat blue"><span>Pelamar Baru</span><strong>${apps.filter(a=>(a.Status||'Baru')==='Baru').length}</strong></div><div class="card stat amber"><span>Dalam Proses</span><strong>${processing}</strong></div><div class="card stat green"><span>Diterima (Active)</span><strong>${apps.filter(a=>a.Status==='Active').length}</strong></div></section>`+
        `<section class="card"><div class="card-head"><h2>Daftar Pelamar Terbaru</h2><div class="toolbar"><select class="select" style="width:auto" data-action="filter-status"><option>Semua</option>${STATUSES.map(s=>`<option ${state.filterStatus===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="table-wrap"><table class="table"><thead><tr><th class="sticky">ID & Tanggal</th>${FIELDS.map(f=>`<th>${esc(f[1])}</th>`).join('')}<th>Status Rekrutmen</th></tr></thead><tbody>${filtered.length?filtered.map(app=>applicantRow(app)).join(''):`<tr><td colspan="13">${empty('Data tidak ditemukan.')}</td></tr>`}</tbody></table></div></section>`;
      }

      function applicantRow(app){
        const id=app['ID Pelamar'];const status=app.Status||'Baru';const date=app.Timestamp?new Date(app.Timestamp).toLocaleDateString('id-ID'):'-';
        return `<tr><td class="sticky"><strong>${esc(id||'-')}</strong><div class="tiny">${esc(date)}</div></td>${FIELDS.map(f=>`<td>${renderCell(app,f)}</td>`).join('')}<td><select class="status-select ${statusClass(status)}" data-action="status-change" data-id="${esc(id)}" ${state.updating[id]?'disabled':''}>${STATUSES.map(s=>`<option ${s===status?'selected':''}>${s}</option>`).join('')}</select>${state.updating[id]?'<div class="tiny">Menyimpan...</div>':''}</td></tr>`
      }

      function renderCell(app,field){const [name,,type]=field;const value=app[name];if(value===undefined||value==='')return '<span class="tiny">-</span>';
        if(type==='link')return String(value).startsWith('http')?`<a class="link" href="${esc(value)}" target="_blank" rel="noopener">Buka Link</a>`:'<span class="tiny">Link invalid</span>';
        if(type==='tel'){const href=waLink(value,app.Nama||'Kandidat',app['ID Pelamar'],app.Status||'Baru',app.Posisi);return `<span class="small">${esc(value)}</span> <a class="link" style="background:#10b981;padding:5px 7px" href="${esc(href)}" target="_blank">WA</a>`}
        if(type==='textarea')return `<div class="truncate" data-action="detail" data-id="${esc(app['ID Pelamar'])}" data-title="Address" data-content="${esc(value)}">${esc(value)}</div>`;
        if(type==='select')return `<span class="tag">${esc(value)}</span>`;return `<span class="small">${esc(value)}</span>`}

      function renderCognitive(){
        const d=getRole();const loadingNow=state.roleLoading[roleKey(state.role,'cognitive')];if(!d._loaded_cognitive){view.innerHTML=loadingNow?loading('Memuat modul kognitif...'):empty('Data belum dimuat.');return}
        view.innerHTML=pageHead('Modul Penilaian Kognitif','Kelola soal ujian, standar kelulusan, dan hasil berdasarkan posisi.',roleSelect())+
        `<div class="tabs"><button class="tab-btn ${state.cognitiveTab==='questions'?'active':''}" data-action="cognitive-tab" data-value="questions">🛠️ Custom Pertanyaan</button><button class="tab-btn ${state.cognitiveTab==='grade'?'active':''}" data-action="cognitive-tab" data-value="grade">🎯 Passing Grade</button><button class="tab-btn ${state.cognitiveTab==='results'?'active':''}" data-action="cognitive-tab" data-value="results">📊 Hasil Jawaban</button></div>`+
        (state.cognitiveTab==='questions'?cognitiveQuestionsHtml(d):state.cognitiveTab==='grade'?passingGradeHtml(d):answerResultsHtml(d));
      }

      function cognitiveQuestionsHtml(d){const q=d.cognitiveQuestions||[];return `<section class="card panel"><div class="card-head" style="margin:-20px -20px 18px"><h2>Daftar Soal — ${esc(state.role)}</h2><button class="btn btn-red" data-action="save-cognitive">💾 Simpan Soal</button></div><div class="editor-list">${q.map((item,i)=>`<article class="editor-item" data-question-index="${i}"><div class="editor-head"><div class="number">${i+1}</div><textarea class="textarea" data-edit="cognitive-question" data-index="${i}">${esc(item.question)}</textarea></div><div class="options-grid">${['A','B','C','D'].map(letter=>`<div class="option-edit"><label class="field">Opsi ${letter}<input class="input" data-edit="cognitive-option" data-index="${i}" data-letter="${letter}" value="${esc(item['option'+letter])}"></label><label class="field">Skor<select class="select" data-edit="cognitive-score" data-index="${i}" data-letter="${letter}">${[1,2,3,4].map(s=>`<option ${Number(item['score'+letter])===s?'selected':''}>${s}</option>`).join('')}</select></label></div>`).join('')}</div><div class="delete-row"><button class="btn btn-danger" data-action="delete-cognitive" data-index="${i}">Hapus Soal</button></div></article>`).join('')}<button class="add-dashed" data-action="add-cognitive">➕ Tambah Soal Baru</button></div></section>`}
      function passingGradeHtml(d){const g=d.passingGrade||{rekomen:60,sangatRekomen:85};return `<section class="card panel"><h2>Atur Standar Kelulusan (%)</h2><p class="small" style="color:var(--muted)">Status rekomendasi dihitung otomatis dari persentase skor maksimal.</p><div class="grade-grid"><div class="grade-box blue"><label>Batas “Terekomendasi”</label><div class="grade-value"><input class="input" type="number" min="0" max="100" data-edit="grade-rekomen" value="${esc(g.rekomen)}"><strong>%</strong></div></div><div class="grade-box green"><label>Batas “Sangat Direkomendasikan”</label><div class="grade-value"><input class="input" type="number" min="0" max="100" data-edit="grade-sangat" value="${esc(g.sangatRekomen)}"><strong>%</strong></div></div></div><button class="btn btn-dark" style="margin-top:18px" data-action="save-grade">Simpan Passing Grade</button></section>`}
      function answerResultsHtml(d){const headers=d.answerHeaders||[];const rows=d.answerResults||[];return `<section class="card"><div class="card-head"><h2>Database Jawaban Pelamar</h2><button class="btn btn-dark" data-action="refresh-role" data-section="cognitive">↻ Refresh</button></div><div class="table-wrap"><table class="table"><thead><tr>${headers.map((h,i)=>`<th class="${i===0?'sticky':''}">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(row=>`<tr>${headers.map((h,i)=>`<td class="${i===0?'sticky':''}">${h==='Status Rekomendasi'?`<span class="tag">${esc(row[h]||'-')}</span>`:esc(row[h]||'-')}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length||1}">${empty('Belum ada kandidat yang mensubmit tes.')}</td></tr>`}</tbody></table></div></section>`}

      function renderInterview(){const d=getRole();const key=roleKey(state.role,'interview');if(!d._loaded_interview){view.innerHTML=state.roleLoading[key]?loading('Memuat modul wawancara...'):empty('Data belum dimuat.');return}
        view.innerHTML=pageHead('Modul Penilaian Wawancara','Kelola pertanyaan dan live grading berdasarkan posisi.',roleSelect())+`<div class="tabs"><button class="tab-btn ${state.interviewTab==='questions'?'active':''}" data-action="interview-tab" data-value="questions">🛠️ Custom Pertanyaan</button><button class="tab-btn ${state.interviewTab==='grading'?'active':''}" data-action="interview-tab" data-value="grading">🎙️ Penilaian Langsung</button></div>`+(state.interviewTab==='questions'?interviewQuestionsHtml(d):interviewGradingHtml(d));}
      function interviewQuestionsHtml(d){const q=d.interviewQuestions||[];return `<section class="card panel"><div class="card-head" style="margin:-20px -20px 18px"><h2>Pertanyaan Wawancara — ${esc(state.role)}</h2><button class="btn btn-blue" data-action="save-interview">💾 Simpan Pertanyaan</button></div><div class="editor-list">${q.map((item,i)=>`<div class="editor-item"><div class="editor-head"><div class="number" style="background:var(--blue)">${i+1}</div><input class="input" data-edit="interview-question" data-index="${i}" value="${esc(item.question)}"><button class="btn btn-danger" data-action="delete-interview" data-index="${i}">Hapus</button></div></div>`).join('')}<button class="add-dashed" data-action="add-interview">➕ Tambah Pertanyaan Wawancara</button></div></section>`}
      function interviewGradingHtml(d){const qs=d.interviewQuestions||[];const results=d.interviewResults||[];const apps=activeApplicants().filter(a=>a.Posisi===state.role&&['Wawancara','Sudah Wawancara','Onboarding','Active'].includes(a.Status));return `<section class="card"><div class="card-head"><div><h2>Daftar Kandidat Tahap Wawancara</h2><div class="tiny">Menampilkan kandidat Wawancara hingga Active.</div></div></div><div class="candidate-list"><div class="candidate-row header"><span>ID</span><span>Nama</span><span>Posisi</span><span>Skor</span><span>Aksi</span></div>${apps.length?apps.map(app=>{const id=app['ID Pelamar'];const r=results.find(x=>String(x.idPelamar).trim()===String(id).trim());const max=r&&Number(r.maxScore)>0?Number(r.maxScore):qs.length*3;return `<div class="candidate-row"><strong>${esc(id)}</strong><span>${esc(app.Nama)}</span><span class="tag">${esc(app.Posisi)}</span><span class="score">${r?esc(r.totalScore)+' / '+max:'-'}</span><button class="btn ${r?'btn-light':'btn-blue'}" data-action="open-grading" data-id="${esc(id)}" ${r||!qs.length?'disabled':''}>${r?'Selesai ✅':!qs.length?'Buat Soal Dulu':'Mulai Wawancara 🎙️'}</button></div>`}).join(''):empty('Belum ada kandidat di tahap wawancara.')}</div></section>`}

      function renderOnboarding(){const d=getRole();const key=roleKey(state.role,'onboarding');if(!d._loaded_onboarding){view.innerHTML=state.roleLoading[key]?loading('Memuat onboarding...'):empty('Data belum dimuat.');return}
        view.innerHTML=pageHead('Management Onboarding','Kelola perjanjian dan status tanda tangan berdasarkan posisi.',roleSelect())+`<div class="tabs"><button class="tab-btn ${state.onboardingTab==='editor'?'active':''}" data-action="onboarding-tab" data-value="editor">📝 Editor Perjanjian</button><button class="tab-btn ${state.onboardingTab==='signatures'?'active':''}" data-action="onboarding-tab" data-value="signatures">✅ Status TTD</button></div>`+(state.onboardingTab==='editor'?onboardingEditorHtml(d):signatureHtml(d));}
      function onboardingEditorHtml(d){const clauses=d.clauses||[];return `<section class="card panel"><div class="card-head" style="margin:-20px -20px 18px"><h2>Pasal Perjanjian — ${esc(state.role)}</h2><button class="btn btn-light" data-action="add-clause">+ Tambah Pasal</button></div><div class="clause-list">${clauses.map((c,i)=>`<article class="clause"><input class="input" data-edit="clause-title" data-index="${i}" value="${esc(c.title)}"><textarea class="textarea" style="margin-top:9px" data-edit="clause-content" data-index="${i}">${esc(c.content)}</textarea><div class="delete-row"><button class="btn btn-danger" data-action="delete-clause" data-index="${i}">Hapus Pasal</button></div></article>`).join('')}<button class="btn btn-dark" data-action="save-onboarding">💾 Simpan Template Perjanjian</button></div></section>`}
      function signatureHtml(d){const rows=d.signatures||[];return `<section class="card"><div class="card-head"><h2>Status Penandatanganan Kontrak</h2><button class="btn btn-dark" data-action="refresh-role" data-section="onboarding">↻ Refresh</button></div><div class="table-wrap"><table class="table"><thead><tr><th>ID Pelamar</th><th>Nama Tanda Tangan</th><th>Posisi</th><th>Waktu Disetujui</th><th>Status</th><th>Dokumen PDF</th></tr></thead><tbody>${rows.length?rows.map(s=>`<tr><td><strong>${esc(s[0])}</strong></td><td>${esc(s[1])}</td><td>${esc(s[2])}</td><td>${esc(s[3])}</td><td><span class="tag">${esc(s[4]||'SIGNED')}</span></td><td>${s[5]?`<a class="link" href="${esc(s[5])}" target="_blank">Buka Dokumen</a>`:'-'}</td></tr>`).join(''):`<tr><td colspan="6">${empty('Belum ada kandidat yang menandatangani kontrak.')}</td></tr>`}</tbody></table></div></section>`}

      function renderNotifications(){if(!state.notificationsLoaded){view.innerHTML=loading('Memuat assigned admin email...');return}view.innerHTML=pageHead('Assigned Admin Email','Tentukan admin yang menerima notifikasi ketika ada pelamar baru.',`<div class="toolbar"><button class="btn btn-light" data-action="refresh-notifications">↻ Refresh</button><button class="btn btn-dark" data-action="add-notification">+ Tambah Admin</button></div>`)+`<div class="notice">Admin berstatus <strong>Active</strong> menerima email berdasarkan posisi yang dicentang. Data disimpan ke sheet <strong>AdminNotifications</strong>.</div><section class="card"><div class="table-wrap"><table class="table notification-table"><thead><tr><th>Nama Admin</th><th>Email</th><th>Active</th><th>English Trainer</th><th>Admin</th><th>Team Leader</th><th>Aksi</th></tr></thead><tbody>${state.notifications.length?state.notifications.map((n,i)=>`<tr><td><input class="input" data-edit="notification-text" data-field="name" data-index="${i}" value="${esc(n.name)}"></td><td><input class="input" type="email" data-edit="notification-text" data-field="email" data-index="${i}" value="${esc(n.email)}"></td>${['active','englishTrainer','admin','teamLeader'].map(f=>`<td style="text-align:center"><input class="check" type="checkbox" data-edit="notification-check" data-field="${f}" data-index="${i}" ${n[f]?'checked':''}></td>`).join('')}<td><button class="btn btn-danger" data-action="delete-notification" data-index="${i}">Hapus</button></td></tr>`).join(''):`<tr><td colspan="7">${empty('Belum ada admin penerima email.')}</td></tr>`}</tbody></table></div><div class="card-head" style="border-top:1px solid var(--line);border-bottom:0"><span class="tiny">Pastikan alamat email valid sebelum menyimpan.</span><button class="btn btn-green" data-action="save-notifications">💾 Simpan Assigned Email</button></div></section>`}

      function renderRecap(){const d=getRole();const key=roleKey(state.role,'recap');if(!state.dashboardLoaded||!d._loaded_recap){view.innerHTML=loading('Memuat overall recap...');return}const apps=activeApplicants().filter(a=>a.Posisi===state.role&&['Wawancara','Sudah Wawancara','Onboarding','Active'].includes(a.Status));const answers=d.answerResults||[];const ints=d.interviewResults||[];const iq=d.interviewQuestions||[];
        view.innerHTML=pageHead('Overall Assessment Recap 📊','Rangkuman nilai kandidat dari tahap Kognitif hingga Wawancara.',roleSelect())+`<section class="recap-grid">${apps.length?apps.map(app=>{const id=app['ID Pelamar'];const kr=answers.find(h=>h['ID Pelamar']===id||h.Nama===app.Nama);const kp=kr?parseInt(kr.Persentase||kr['Total Score']||0,10)||0:0;const ir=ints.find(r=>String(r.idPelamar)===String(id));const raw=ir?parseInt(ir.totalScore,10)||0:0;const max=ir&&Number(ir.maxScore)>0?Number(ir.maxScore):(iq.length?iq.length*3:1);const ip=ir?Math.round(raw/max*100):0;const final=Math.round((kp+ip)/2);return `<article class="card recap-card"><h3>${esc(app.Nama||'Kandidat')}</h3><div class="tiny">${esc(id)} • ${esc(app.Posisi)}</div><div class="progress-row">${ring(kp,'Kognitif','#7c3aed')}${ring(ip,'Wawancara','#2563eb')}${ring(final,'Rata-rata',final>=75?'#10b981':final>=50?'#eab308':'#ef4444')}</div><div class="small"><strong>Status:</strong> ${esc(app.Status)}</div><button class="btn btn-dark" style="width:100%;margin-top:13px" data-action="detail" data-id="${esc(id)}" data-title="Detail Assessment: ${esc(app.Nama)}" data-content="Nilai Kognitif: ${kp}%\nNilai Wawancara: ${raw}/${max} (${ip}%)\nRata-rata Keseluruhan: ${final}%">Lihat Detail Analitik</button></article>`}).join(''):empty('Belum ada kandidat yang mencapai tahap evaluasi lanjutan.')}</section>`}
      function ring(p,label,color){return `<div class="progress"><div class="ring" style="--p:${Math.max(0,Math.min(100,p))};--ring:${color}"><strong>${p}%</strong></div><span>${label}</span></div>`}

      function waLink(noWa,nama,id,status,posisi){let no=String(noWa||'').replace(/\D/g,'');if(no.startsWith('0'))no='62'+no.slice(1);const portal=new URL('index.html',location.href).href;let message=`Halo ${nama}, status lamaran Anda untuk posisi ${posisi||'-'} diperbarui menjadi: ${status}.`;if(status==='Penilaian Cognitive')message=`Halo ${nama}, selamat! Anda masuk tahap Penilaian Kognitif untuk posisi ${posisi||'-'}.\n\nPortal: ${portal}\nID Pelamar: ${id}\nWaktu pengerjaan: 30 menit.`;else if(status==='Onboarding')message=`Halo ${nama}, selamat! Anda masuk tahap Onboarding untuk posisi ${posisi||'-'}.\n\nPortal: ${portal}\nID Pelamar: ${id}`;return `https://wa.me/${no}?text=${encodeURIComponent(message)}`}

      async function updateStatus(id,newStatus,details){const app=state.applicants.find(a=>String(a['ID Pelamar'])===String(id));if(!app)return;const previous=app.Status;app.Status=newStatus;state.updating[id]=true;render();try{const r=await api('updateApplicantStatusAndNotify',id,newStatus,details||null);if(!r||!r.success)throw new Error(r?.message||'Status gagal disimpan.');if(r.emailSent===false)showDialog('alert','Status Tersimpan','Status diperbarui, tetapi email kandidat tidak terkirim: '+(r.emailMessage||'-'))}catch(e){app.Status=previous;showDialog('alert','Gagal',errorText(e))}finally{delete state.updating[id];render()}}
      async function saveCognitive(){const d=getRole();try{const r=await api('saveKognitifQuestions',state.role,d.cognitiveQuestions||[]);if(!r?.success)throw new Error(r?.message||'Gagal menyimpan.');d._loaded_cognitive=false;await loadRoleSection('cognitive',true);showDialog('success','Berhasil','Soal kognitif '+state.role+' tersimpan.')}catch(e){showDialog('alert','Gagal',errorText(e))}}
      async function saveGrade(){const d=getRole();try{const r=await api('savePassingGrade',state.role,d.passingGrade);if(!r?.success)throw new Error(r?.message||'Gagal menyimpan.');showDialog('success','Berhasil','Passing grade berhasil diperbarui.')}catch(e){showDialog('alert','Gagal',errorText(e))}}
      async function saveInterview(){const d=getRole();try{const r=await api('saveInterviewQuestions',state.role,d.interviewQuestions||[]);if(!r?.success)throw new Error(r?.message||'Gagal menyimpan.');d._loaded_interview=false;await loadRoleSection('interview',true);showDialog('success','Berhasil','Pertanyaan wawancara tersimpan.')}catch(e){showDialog('alert','Gagal',errorText(e))}}
      async function saveOnboarding(){const d=getRole();try{const r=await api('saveOnboardingClauses',state.role,d.clauses||[]);if(!r?.success)throw new Error(r?.message||'Gagal menyimpan.');d._loaded_onboarding=false;await loadRoleSection('onboarding',true);showDialog('success','Berhasil','Template perjanjian tersimpan.')}catch(e){showDialog('alert','Gagal',errorText(e))}}
      async function saveNotifications(){try{const r=await api('saveAdminNotifications',state.notifications);if(!r?.success)throw new Error(r?.message||'Gagal menyimpan.');showDialog('success','Berhasil','Daftar admin penerima email tersimpan.')}catch(e){showDialog('alert','Gagal',errorText(e))}}
      async function submitGrading(){const modal=state.gradingModal;if(!modal)return;const total=Object.values(modal.answers).reduce((a,b)=>a+Number(b||0),0);try{const app=modal.app;const r=await api('submitInterviewResult',app['ID Pelamar'],app.Nama,app.Posisi,total,modal.answers);if(!r?.success)throw new Error(r?.message||'Nilai gagal disimpan.');closeModal();getRole()._loaded_interview=false;await loadRoleSection('interview',true);await loadDashboard(true);showDialog('success','Nilai Tersimpan','Total skor kandidat: '+total)}catch(e){showDialog('alert','Gagal',errorText(e))}}

      function renderModal(){
        if(state.dialog){const d=state.dialog;modalRoot.innerHTML=`<div class="backdrop"><section class="modal"><div class="dialog"><div class="dialog-icon ${d.type}">${d.type==='confirm'?'?':d.type==='success'?'✓':'!'}</div><h2>${esc(d.title)}</h2><p>${esc(d.message)}</p><div class="toolbar" style="justify-content:center">${d.type==='confirm'?'<button class="btn btn-light" data-modal="cancel">Batal</button>':''}<button class="btn btn-dark" data-modal="confirm">${d.type==='confirm'?'Ya, Lanjutkan':'Tutup'}</button></div></div></section></div>`;return}
        if(state.selectedDetail){const d=state.selectedDetail;modalRoot.innerHTML=`<div class="backdrop"><section class="modal"><div class="modal-head"><div><h2>${esc(d.title)}</h2><p>ID: ${esc(d.id)}</p></div><button class="close" data-modal="close">×</button></div><div class="modal-body"><div class="notice" style="white-space:pre-wrap;background:#fafafa;color:#374151;border-color:#e5e7eb">${esc(d.content)}</div></div></section></div>`;return}
        if(state.interviewModal){const m=state.interviewModal;modalRoot.innerHTML=`<div class="backdrop"><section class="modal"><div class="modal-head"><div><h2>Atur Jadwal Wawancara</h2><p>Kandidat: ${esc(m.app.Nama||'Kandidat')}</p></div><button class="close" data-modal="close">×</button></div><div class="modal-body"><div class="radio-grid"><button class="radio-choice ${m.type==='online'?'active':''}" data-modal="interview-type" data-value="online">🌐 Online</button><button class="radio-choice ${m.type==='offline'?'active':''}" data-modal="interview-type" data-value="offline">🏢 Offline</button></div><label class="field" style="display:grid;gap:7px;margin-top:15px"><strong class="tiny">TANGGAL & WAKTU</strong><input class="input" type="datetime-local" data-modal-input="datetime" value="${esc(m.datetime||'')}"></label><label class="field" style="display:grid;gap:7px;margin-top:15px"><strong class="tiny">${m.type==='online'?'LINK GOOGLE MEET / ZOOM':'ALAMAT LENGKAP'}</strong><textarea class="textarea" data-modal-input="location">${esc(m.location||'')}</textarea></label></div><div class="modal-foot"><button class="btn btn-light" data-modal="close">Batal</button><button class="btn btn-dark" data-modal="send-interview">Simpan & Kirim WA</button></div></section></div>`;return}
        if(state.gradingModal){const m=state.gradingModal;const q=getRole().interviewQuestions||[];const total=Object.values(m.answers).reduce((a,b)=>a+Number(b||0),0);modalRoot.innerHTML=`<div class="backdrop"><section class="modal wide"><div class="modal-head"><div><h2>Form Penilaian Wawancara</h2><p>Kandidat: ${esc(m.app.Nama)}</p></div><button class="close" data-modal="close">×</button></div><div class="modal-body grading-list">${q.map((item,i)=>`<div class="grading-item"><p>${i+1}. ${esc(item.question)}</p><div class="score-buttons">${[1,2,3].map(score=>`<button class="score-btn s${score} ${Number(m.answers[item.id])===score?'active':''}" data-modal="grade-score" data-qid="${esc(item.id)}" data-score="${score}">${score} - ${score===1?'Tidak Relevan':score===2?'Relevan':'Sangat Relevan'}</button>`).join('')}</div></div>`).join('')}</div><div class="modal-foot"><strong style="margin-right:auto">Total: ${total}</strong><button class="btn btn-blue" data-modal="submit-grading">Simpan Nilai</button></div></section></div>`;return}
        modalRoot.innerHTML='';
      }

      document.getElementById('main-nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;state.tab=b.dataset.tab;if(innerWidth<760){state.sidebar=false;document.getElementById('sidebar').classList.add('closed')}render();ensureTabData()});
      document.getElementById('menu').addEventListener('click',()=>{state.sidebar=!state.sidebar;document.getElementById('sidebar').classList.toggle('closed',!state.sidebar)});
      document.getElementById('logout').addEventListener('click',()=>showDialog('confirm','Keluar Sistem','Yakin ingin keluar dari Dashboard HR?',()=>{location.href=KIP_API.buildPageUrl('index.html')}));

      view.addEventListener('change',e=>{
        const a=e.target.dataset.action,edit=e.target.dataset.edit;
        if(a==='filter-status'){state.filterStatus=e.target.value;render()}
        else if(a==='role-change'){state.role=e.target.value;render();ensureTabData()}
        else if(a==='status-change'){const id=e.target.dataset.id;const status=e.target.value;if(status==='Wawancara'){const app=state.applicants.find(x=>String(x['ID Pelamar'])===String(id));state.interviewModal={app,type:'online',datetime:'',location:''};renderModal()}else updateStatus(id,status)}
        else if(edit==='cognitive-question'){getRole().cognitiveQuestions[+e.target.dataset.index].question=e.target.value}
        else if(edit==='cognitive-option'){getRole().cognitiveQuestions[+e.target.dataset.index]['option'+e.target.dataset.letter]=e.target.value}
        else if(edit==='cognitive-score'){getRole().cognitiveQuestions[+e.target.dataset.index]['score'+e.target.dataset.letter]=+e.target.value}
        else if(edit==='grade-rekomen'){getRole().passingGrade.rekomen=+e.target.value}
        else if(edit==='grade-sangat'){getRole().passingGrade.sangatRekomen=+e.target.value}
        else if(edit==='interview-question'){getRole().interviewQuestions[+e.target.dataset.index].question=e.target.value}
        else if(edit==='clause-title'){getRole().clauses[+e.target.dataset.index].title=e.target.value}
        else if(edit==='clause-content'){getRole().clauses[+e.target.dataset.index].content=e.target.value}
        else if(edit==='notification-text'){state.notifications[+e.target.dataset.index][e.target.dataset.field]=e.target.value}
        else if(edit==='notification-check'){state.notifications[+e.target.dataset.index][e.target.dataset.field]=e.target.checked}
      });

      view.addEventListener('input',e=>{const edit=e.target.dataset.edit;if(!edit)return;e.target.dispatchEvent(new Event('change',{bubbles:true}))});
      view.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;
        if(action==='refresh-dashboard')loadDashboard(true);
        else if(action==='cognitive-tab'){state.cognitiveTab=b.dataset.value;render()}
        else if(action==='interview-tab'){state.interviewTab=b.dataset.value;render()}
        else if(action==='onboarding-tab'){state.onboardingTab=b.dataset.value;render()}
        else if(action==='save-cognitive')saveCognitive();
        else if(action==='add-cognitive'){const q=getRole().cognitiveQuestions||(getRole().cognitiveQuestions=[]);const id=q.length?Math.max(...q.map(x=>Number(x.id)||0))+1:1;q.push({id,question:'',optionA:'',optionB:'',optionC:'',optionD:'',scoreA:1,scoreB:2,scoreC:3,scoreD:4});render()}
        else if(action==='delete-cognitive'){const i=+b.dataset.index;showDialog('confirm','Hapus Soal?','Hapus soal ini dari template?',()=>{getRole().cognitiveQuestions.splice(i,1);render()})}
        else if(action==='save-grade')saveGrade();
        else if(action==='refresh-role')loadRoleSection(b.dataset.section,true);
        else if(action==='save-interview')saveInterview();
        else if(action==='add-interview'){const q=getRole().interviewQuestions||(getRole().interviewQuestions=[]);const id=q.length?Math.max(...q.map(x=>Number(x.id)||0))+1:1;q.push({id,question:'Ketik pertanyaan wawancara baru...'});render()}
        else if(action==='delete-interview'){const i=+b.dataset.index;showDialog('confirm','Hapus Pertanyaan?','Hapus pertanyaan wawancara ini?',()=>{getRole().interviewQuestions.splice(i,1);render()})}
        else if(action==='open-grading'){const app=state.applicants.find(x=>String(x['ID Pelamar'])===String(b.dataset.id));const answers={};(getRole().interviewQuestions||[]).forEach(q=>answers[q.id]=0);state.gradingModal={app,answers};renderModal()}
        else if(action==='add-clause'){const c=getRole().clauses||(getRole().clauses=[]);c.push({id:c.length+1,title:'Judul Pasal Baru',content:'Isi pasal di sini...'});render()}
        else if(action==='delete-clause'){const i=+b.dataset.index;showDialog('confirm','Hapus Pasal?','Hapus pasal ini?',()=>{getRole().clauses.splice(i,1);render()})}
        else if(action==='save-onboarding')saveOnboarding();
        else if(action==='refresh-notifications')loadNotifications(true);
        else if(action==='add-notification'){state.notifications.push({id:'new-'+Date.now(),name:'',email:'',active:true,englishTrainer:true,admin:false,teamLeader:false});render()}
        else if(action==='delete-notification'){const i=+b.dataset.index;showDialog('confirm','Hapus Admin Penerima?','Hapus data penerima email ini?',()=>{state.notifications.splice(i,1);render()})}
        else if(action==='save-notifications')saveNotifications();
        else if(action==='detail'){state.selectedDetail={id:b.dataset.id,title:b.dataset.title,content:b.dataset.content};renderModal()}
      });

      modalRoot.addEventListener('input',e=>{if(!state.interviewModal)return;const key=e.target.dataset.modalInput;if(key)state.interviewModal[key]=e.target.value});
      modalRoot.addEventListener('click',e=>{const b=e.target.closest('[data-modal]');if(!b)return;const action=b.dataset.modal;
        if(action==='close'||action==='cancel')closeModal();
        else if(action==='confirm'){const cb=state.dialog&&state.dialog.onConfirm;state.dialog=null;renderModal();if(typeof cb==='function')cb()}
        else if(action==='interview-type'){state.interviewModal.type=b.dataset.value;renderModal()}
        else if(action==='send-interview'){const m=state.interviewModal;if(!m.datetime||!m.location.trim()){showDialog('alert','Data Belum Lengkap','Isi jadwal wawancara dan link/lokasi.');return}const app=m.app;const date=new Date(m.datetime).toLocaleString('id-ID',{dateStyle:'full',timeStyle:'short'});let msg=`Halo ${app.Nama}, selamat! Anda lolos ke tahap Wawancara untuk posisi ${app.Posisi}.\n\nJadwal: ${date} WIB\n`;msg+=m.type==='online'?`Format: Online\nLink: ${m.location}\n`:`Format: Offline\nLokasi: ${m.location}\n`;const no=String(app.NoWA||'').replace(/\D/g,'').replace(/^0/,'62');window.open(`https://wa.me/${no}?text=${encodeURIComponent(msg)}`,'_blank');const details={type:m.type,datetime:m.datetime,location:m.location};const id=app['ID Pelamar'];closeModal();updateStatus(id,'Wawancara',details)}
        else if(action==='grade-score'){state.gradingModal.answers[b.dataset.qid]=+b.dataset.score;renderModal()}
        else if(action==='submit-grading')submitGrading();
      });

      window.addEventListener('error',e=>showDialog('alert','Admin Dashboard Error',e.message||'Unknown error'));
      if(innerWidth<760){state.sidebar=false;document.getElementById('sidebar').classList.add('closed')}
      render();ensureTabData();
    })();
  </script>
</body>
</html>
