<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">

  <title>Kampung Inggris Pontianak | Recruitment Portal</title>

  <link rel="icon" href="./kip-logo.webp">
  <link rel="preload" as="image" href="./kip-logo.webp">

  <style>
    :root {
      --red: #c81e1e;
      --ink: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --surface: #ffffff;
      --canvas: #f7f7f8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--canvas);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      position: relative;
    }

    #app-frame {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;
      background: white;

      opacity: 0;
      transition: opacity .25s ease;
    }

    #app-frame.ready {
      opacity: 1;
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 20;

      display: grid;
      place-items: center;

      padding: 24px;

      background:
        radial-gradient(
          circle at top right,
          rgba(200, 30, 30, .08),
          transparent 32%
        ),
        var(--canvas);

      transition:
        opacity .25s ease,
        visibility .25s ease;
    }

    .loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-card {
      width: min(100%, 390px);

      padding: 34px 28px;

      text-align: center;

      background: rgba(255, 255, 255, .97);

      border: 1px solid var(--line);
      border-radius: 24px;

      box-shadow:
        0 24px 70px rgba(17, 24, 39, .10);
    }

    .logo-box {
      width: 170px;
      height: 90px;

      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #fff;

      border: 1px solid var(--line);
      border-radius: 18px;

      overflow: hidden;
    }

    .logo-box img {
      width: 100%;
      height: 100%;

      object-fit: contain;

      padding: 7px;
    }

    h1 {
      margin: 0;

      font-size: 23px;
      line-height: 1.25;

      color: var(--ink);

      letter-spacing: -.03em;
    }

    p {
      margin: 9px 0 0;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.6;
    }

    .spinner {
      width: 34px;
      height: 34px;

      margin: 24px auto 0;

      border: 4px solid #e5e7eb;
      border-top-color: var(--red);
      border-radius: 50%;

      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .fallback {
      display: none;

      margin-top: 22px;
    }

    .fallback.show {
      display: block;
    }

    .fallback a {
      display: inline-flex;

      min-height: 44px;

      padding: 11px 18px;

      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background: var(--red);

      color: white;

      text-decoration: none;

      font-weight: 800;
      font-size: 14px;
    }

    .fallback small {
      display: block;

      margin-top: 10px;

      color: #9ca3af;

      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div id="loader" class="loader">

    <div class="loader-card">

      <div class="logo-box">
        <img
          src="./kip-logo.webp"
          alt="Kampung Inggris Pontianak"
        >
      </div>

      <h1>KIP Recruitment Portal</h1>

      <p>
        Menghubungkan ke sistem rekrutmen
        Kampung Inggris Pontianak...
      </p>

      <div class="spinner"></div>

      <div id="fallback" class="fallback">

        <a
          id="open-direct"
          href="#"
          target="_blank"
          rel="noopener"
        >
          Buka Portal
        </a>

        <small>
          Jika portal tidak terbuka otomatis,
          gunakan tombol di atas.
        </small>

      </div>

    </div>

  </div>


  <iframe
    id="app-frame"
    title="KIP Recruitment Portal"
    allow="clipboard-read; clipboard-write"
  ></iframe>


  <script>
    (function () {
      'use strict';

      /*
       * =====================================================
       * REPLACE THIS WITH YOUR GOOGLE APPS SCRIPT /exec URL
       * =====================================================
       */

      const GAS_WEB_APP_URL =
        'https://script.google.com/macros/s/AKfycbxUkKCjDDiXLZBgqoLek0N2VldnUKd5YDdpWZQV4kNoNZswqWA7NmF5uLIz65YD1_Hf/exec';


      const frame =
        document.getElementById('app-frame');

      const loader =
        document.getElementById('loader');

      const fallback =
        document.getElementById('fallback');

      const directLink =
        document.getElementById('open-direct');


      function validGasUrl(url) {
        return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:[?#].*)?$/
          .test(String(url || '').trim());
      }


      if (!validGasUrl(GAS_WEB_APP_URL)) {

        document.querySelector('.spinner').style.display =
          'none';

        document.querySelector('.loader-card p').textContent =
          'GAS Web App URL belum dikonfigurasi.';

        return;
      }


      directLink.href = GAS_WEB_APP_URL;

      frame.src = GAS_WEB_APP_URL;


      frame.addEventListener('load', function () {

        frame.classList.add('ready');

        setTimeout(function () {
          loader.classList.add('hide');
        }, 150);

      });


      /*
       * Fallback shown if Google takes unusually long
       * to render the GAS web app.
       */

      setTimeout(function () {

        if (!frame.classList.contains('ready')) {
          fallback.classList.add('show');
        }

      }, 7000);

    })();
  </script>

</body>
</html>
