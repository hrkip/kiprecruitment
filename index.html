<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Karir KIP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <script>
    // Paste the deployed Apps Script Web App /exec URL here once.
    const GAS_API_URL = 'PASTE_YOUR_DEPLOYED_GAS_WEB_APP_URL_HERE';

    (function setupAppsScriptBridge() {
      'use strict';

      const STORAGE_KEY = 'kip_gas_api_url';
      const CHANNEL = 'KIP_GAS_RPC';
      const pendingRequests = new Map();
      let requestCounter = 0;
      let bridgeReady = false;
      let bridgeIframe = null;
      let bridgeReadyResolver = null;

      function isValidApiUrl(value) {
        return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:[?#].*)?$/.test(
          String(value || '').trim()
        );
      }

      function saveApiUrl(value) {
        if (!isValidApiUrl(value)) return;
        try { localStorage.setItem(STORAGE_KEY, String(value).trim()); } catch (ignored) {}
      }

      function readStoredApiUrl() {
        try { return localStorage.getItem(STORAGE_KEY) || ''; } catch (ignored) { return ''; }
      }

      function resolveApiUrl() {
        const queryValue = new URLSearchParams(window.location.search).get('api') || '';

        if (isValidApiUrl(queryValue)) {
          saveApiUrl(queryValue);
          return queryValue.trim();
        }

        if (isValidApiUrl(GAS_API_URL)) {
          saveApiUrl(GAS_API_URL);
          return GAS_API_URL.trim();
        }

        const storedValue = readStoredApiUrl();
        return isValidApiUrl(storedValue) ? storedValue.trim() : '';
      }

      function clientBaseUrl() {
        return new URL('.', window.location.href).href;
      }

      const apiUrl = resolveApiUrl();
      window.KIP_API_URL = apiUrl;

      window.buildGitHubPageUrl = function buildGitHubPageUrl(fileName) {
        const url = new URL(fileName, window.location.href);
        if (apiUrl) url.searchParams.set('api', apiUrl);
        return url.href;
      };

      function initializeIframeBridge() {
        if (!apiUrl || bridgeIframe) return;

        bridgeIframe = document.createElement('iframe');
        bridgeIframe.title = 'KIP Apps Script Bridge';
        bridgeIframe.setAttribute('aria-hidden', 'true');
        bridgeIframe.style.position = 'fixed';
        bridgeIframe.style.width = '1px';
        bridgeIframe.style.height = '1px';
        bridgeIframe.style.opacity = '0';
        bridgeIframe.style.pointerEvents = 'none';
        bridgeIframe.style.border = '0';
        bridgeIframe.style.left = '-9999px';
        bridgeIframe.src = apiUrl;

        (document.body || document.documentElement).appendChild(bridgeIframe);
      }

      window.addEventListener('message', function (event) {
        if (!bridgeIframe || event.source !== bridgeIframe.contentWindow) return;

        const payload = event.data || {};
        if (payload.channel !== CHANNEL) return;

        if (payload.type === 'ready') {
          bridgeReady = true;
          if (bridgeReadyResolver) {
            bridgeReadyResolver(true);
            bridgeReadyResolver = null;
          }
          return;
        }

        if (payload.type !== 'response' || !pendingRequests.has(payload.id)) return;

        const pending = pendingRequests.get(payload.id);
        pendingRequests.delete(payload.id);
        clearTimeout(pending.timeoutId);

        if (payload.ok === true) {
          pending.resolve(payload.result);
        } else {
          pending.reject(new Error(payload.error || 'Apps Script request failed.'));
        }
      });

      function waitForIframeBridge() {
        initializeIframeBridge();

        if (bridgeReady) return Promise.resolve(true);
        if (!bridgeIframe) return Promise.resolve(false);

        return new Promise(function (resolve) {
          let settled = false;

          bridgeReadyResolver = function (value) {
            if (settled) return;
            settled = true;
            resolve(value);
          };

          setTimeout(function () {
            if (settled) return;
            settled = true;
            bridgeReadyResolver = null;
            resolve(false);
          }, 8000);
        });
      }

      function invokeThroughIframe(action, args) {
        return new Promise(function (resolve, reject) {
          const id = 'rpc-' + Date.now() + '-' + (++requestCounter);
          const timeoutId = setTimeout(function () {
            pendingRequests.delete(id);
            reject(new Error('Apps Script bridge tidak merespons.'));
          }, 60000);

          pendingRequests.set(id, { resolve, reject, timeoutId });
          bridgeIframe.contentWindow.postMessage({
            channel: CHANNEL,
            type: 'request',
            id,
            action,
            args,
            clientBaseUrl: clientBaseUrl()
          }, '*');
        });
      }

      async function invokeThroughFetch(action, args) {
        const formBody = new URLSearchParams();
        formBody.set('payload', JSON.stringify({
          action,
          args,
          clientBaseUrl: clientBaseUrl()
        }));

        const response = await fetch(apiUrl, {
          method: 'POST',
          body: formBody,
          redirect: 'follow'
        });

        const responseText = await response.text();
        let payload;

        try {
          payload = JSON.parse(responseText);
        } catch (error) {
          throw new Error(
            'Respons GAS bukan JSON. Pastikan deployment dijalankan sebagai pemilik dan aksesnya diatur ke Anyone.'
          );
        }

        if (!payload || payload.ok !== true) {
          throw new Error(payload && payload.error ? payload.error : 'Respons API tidak valid.');
        }

        return payload.result;
      }

      async function invokeApi(action, args) {
        if (!apiUrl) {
          throw new Error('GAS API URL belum dikonfigurasi. Isi GAS_API_URL di bagian atas index.html dengan URL deployment /exec.');
        }

        const ready = await waitForIframeBridge();

        if (ready) {
          try {
            return await invokeThroughIframe(action, args);
          } catch (iframeError) {
            console.warn('Iframe bridge failed, using fetch fallback.', iframeError);
          }
        }

        return invokeThroughFetch(action, args);
      }

      function createRunner(successHandler, failureHandler) {
        return new Proxy({}, {
          get: function (_target, property) {
            if (property === 'withSuccessHandler') {
              return function (handler) {
                return createRunner(handler, failureHandler);
              };
            }

            if (property === 'withFailureHandler') {
              return function (handler) {
                return createRunner(successHandler, handler);
              };
            }

            return function () {
              const args = Array.prototype.slice.call(arguments);

              invokeApi(String(property), args)
                .then(function (result) {
                  if (typeof successHandler === 'function') successHandler(result);
                })
                .catch(function (error) {
                  if (typeof failureHandler === 'function') {
                    failureHandler(error);
                  } else if (typeof successHandler === 'function') {
                    successHandler({ success: false, message: error.message });
                  } else {
                    console.error(error);
                  }
                });
            };
          }
        });
      }

      window.google = window.google || {};
      window.google.script = window.google.script || {};
      window.google.script.run = createRunner(null, null);

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeIframeBridge, { once: true });
      } else {
        initializeIframeBridge();
      }
    })();
  </script>

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

<body class="text-gray-900 antialiased selection:bg-red-200 selection:text-red-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function JobPortal() {
      const [formData, setFormData] = useState({
        agreement: false,
        Posisi: '',
        TeachingAudience: []
      });
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [dialog, setDialog] = useState({ isOpen: false, type: 'success', title: '', message: '' });

      const [showLoginModal, setShowLoginModal] = useState(false);
      const [loginType, setLoginType] = useState('Admin');
      const [loginData, setLoginData] = useState({ username: '', password: '', idPelamar: '', rememberMe: false });
      const [isLoggingIn, setIsLoggingIn] = useState(false);
      const [loginStatus, setLoginStatus] = useState({ type: '', message: '' }); 
      const [adminUrl, setAdminUrl] = useState('');

      useEffect(() => {
        const savedUser = localStorage.getItem('hr_username');
        const savedPass = localStorage.getItem('hr_password');
        if (savedUser && savedPass) {
          setLoginData(prev => ({
            ...prev,
            username: savedUser,
            password: savedPass,
            rememberMe: true
          }));
        }
      }, []);

      const handleLoginClick = (type) => {
        setLoginType(type);
        setShowLoginModal(true);
        setLoginStatus({ type: '', message: '' });
        setAdminUrl(''); 
      };

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setIsLoggingIn(true);
        setLoginStatus({ type: '', message: '' });

        if (loginType === 'Admin') {
          google.script.run
            .withSuccessHandler((res) => {
              if (res.success) {
                if (loginData.rememberMe) {
                  localStorage.setItem('hr_username', loginData.username);
                  localStorage.setItem('hr_password', loginData.password);
                } else {
                  localStorage.removeItem('hr_username');
                  localStorage.removeItem('hr_password');
                }

                setLoginStatus({ type: 'success', message: 'Verifikasi sukses! Silakan masuk.' });
                setAdminUrl(buildGitHubPageUrl('Admin.html'));
                setIsLoggingIn(false);
              } else {
                setLoginStatus({ type: 'error', message: res.message });
                setIsLoggingIn(false);
              }
            })
            .verifyAdminLogin(loginData.username, loginData.password);
        } else {
          google.script.run
            .withSuccessHandler((res) => {
              if (res.success) {
                localStorage.setItem('id_pelamar_aktif', loginData.idPelamar);
                setLoginStatus({ type: 'success', message: 'ID Valid! Membuka dashboard tes...' });
                setAdminUrl(buildGitHubPageUrl('Pelamar.html'));
                setIsLoggingIn(false);
              } else {
                setLoginStatus({ type: 'error', message: res.message });
                setIsLoggingIn(false);
              }
            })
            .verifyPelamarLogin(loginData.idPelamar);
        }
      };

      const handleChange = (e) => {
        const { name, value, type, checked } = e.target;
        setFormData(prev => ({
          ...prev,
          [name]: type === 'checkbox' ? checked : value
        }));
      };

      const handleAudienceChange = (value, checked) => {
        setFormData(prev => {
          const current = Array.isArray(prev.TeachingAudience) ? prev.TeachingAudience : [];
          const updated = checked
            ? [...current, value]
            : current.filter(item => item !== value);

          return { ...prev, TeachingAudience: updated };
        });
      };

      const handleFileChange = (e, fieldName) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (f) => {
            const data = f.target.result.split(',')[1];
            setFormData(prev => ({
              ...prev,
              [fieldName]: { name: file.name, mimeType: file.type, data }
            }));
          };
          reader.readAsDataURL(file);
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();

        if (!formData.CV) {
          setDialog({
            isOpen: true,
            type: 'error',
            title: 'Berkas Kurang!',
            message: 'Harap unggah CV Anda.'
          });
          return;
        }

        if (formData.Posisi === 'English Trainer' && (!formData.TeachingAudience || formData.TeachingAudience.length === 0)) {
          setDialog({
            isOpen: true,
            type: 'error',
            title: 'Pilihan Belum Lengkap',
            message: 'Pilih minimal satu Teaching Performance Audience.'
          });
          return;
        }

        setIsSubmitting(true);

        const payload = {
          ...formData,
          TeachingAudience: Array.isArray(formData.TeachingAudience)
            ? formData.TeachingAudience.join(', ')
            : formData.TeachingAudience
        };

        google.script.run
          .withSuccessHandler((res) => {
            if(res.success) {
              const emailInfo = res.candidateEmailSent
                ? 'Email konfirmasi telah dikirim ke alamat email Anda.'
                : 'Lamaran tersimpan, tetapi email konfirmasi belum berhasil dikirim. Tim HR tetap dapat melihat data Anda.';

              setDialog({ 
                isOpen: true,
                type: res.candidateEmailSent ? 'success' : 'error',
                title: res.candidateEmailSent ? 'Lamaran Terkirim! 🎉' : 'Lamaran Tersimpan',
                message: `ID Pelamar: ${res.applicantId}. ${emailInfo}`
              });
              setFormData({ agreement: false, Posisi: '', TeachingAudience: [] });
              e.target.reset();
            } else {
              setDialog({ isOpen: true, type: 'error', title: 'Pengiriman Gagal', message: res.message });
            }
            setIsSubmitting(false);
          })
          .withFailureHandler((err) => {
            setDialog({ isOpen: true, type: 'error', title: 'Koneksi Terputus', message: 'Terjadi kesalahan jaringan: ' + err.message });
            setIsSubmitting(false);
          })
          .processForm(payload);
      };

      return (
        <div>
          <nav className="max-w-4xl mx-auto py-6 px-6 flex justify-between items-center border-b border-gray-200">
            <div className="flex items-center space-x-3 cursor-pointer group">

              <h1 className="text-xl font-bold tracking-tight hidden sm:block text-gray-900 group-hover:text-red-600 transition">Kampung Inggris Pontianak</h1>
            </div>
            <div className="space-x-4 flex items-center">
              <button onClick={() => handleLoginClick('Pelamar')} className="text-sm font-semibold text-gray-600 hover:text-red-600 transition">Login Pelamar</button>
              <button onClick={() => handleLoginClick('Admin')} className="px-5 py-2.5 bg-black text-white text-sm font-bold rounded-lg hover:bg-red-600 transition shadow-md hover:shadow-lg transform hover:-translate-y-0.5">Login Admin</button>
            </div>
          </nav>

          <main className="max-w-2xl mx-auto py-12 px-6">
            <header className="mb-10 text-center">
              <h2 className="text-3xl font-extrabold mb-3 text-black">Formulir Aplikasi</h2>
              <div className="w-16 h-1 bg-red-600 mx-auto mb-4 rounded-full"></div>
              <p className="text-gray-500 font-medium">Silakan lengkapi data diri Anda untuk melamar posisi yang tersedia.</p>
            </header>

            <form onSubmit={handleSubmit} className="space-y-6">
              <section>
                <label className="block text-xs font-bold uppercase tracking-wider text-gray-700">Full Name <span className="text-red-500">*</span></label>
                <input type="text" name="Nama" onChange={handleChange} className="input-field" placeholder="Enter your full name" required />
              </section>

              <section>
                <label className="block text-xs font-bold uppercase tracking-wider text-gray-700">Address <span className="text-red-500">*</span></label>
                <textarea name="Alamat" onChange={handleChange} className="input-field resize-none" rows="3" placeholder="Enter your address" required></textarea>
              </section>

              <section>
                <label className="block text-xs font-bold uppercase tracking-wider text-gray-700">Email <span className="text-red-500">*</span></label>
                <input type="email" name="Email" onChange={handleChange} className="input-field" placeholder="Enter your email" required />
              </section>

              <section>
                <label className="block text-xs font-bold uppercase tracking-wider text-gray-700">WA Number <span className="text-red-500">*</span></label>
                <input type="tel" name="NoWA" onChange={handleChange} className="input-field" placeholder="Example: 081234567890" required />
              </section>

              <section>
                <label className="block text-xs font-bold uppercase tracking-wider text-gray-700">Social Media</label>
                <input type="text" name="Social Media" onChange={handleChange} className="input-field" placeholder="Instagram, TikTok, Facebook, or other account" />
              </section>

              <section>
                <label className="block text-xs font-bold uppercase tracking-wider text-gray-700">Position Applied <span className="text-red-500">*</span></label>
                <select name="Posisi" value={formData.Posisi || ''} onChange={handleChange} className="input-field cursor-pointer" required>
                  <option value="" disabled>Select position...</option>
                  <option value="English Trainer">English Trainer</option>
                  <option value="Admin">Admin</option>
                  <option value="Team Leader">Team Leader</option>
                </select>
              </section>

              {formData.Posisi === 'English Trainer' && (
                <React.Fragment>
                  <section className="bg-gray-50 p-5 rounded-xl border border-gray-200">
                    <label className="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-3">
                      Teaching Performance Audience <span className="text-red-500">*</span>
                    </label>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      {[
                        'SD / Elementary School',
                        'Middle School',
                        'High School',
                        'Public / Adults',
                        'Academic (TOEFL / IELTS)'
                      ].map((audience) => (
                        <label key={audience} className="flex items-center gap-3 bg-white border border-gray-200 rounded-lg p-3 cursor-pointer hover:border-red-400 transition">
                          <input
                            type="checkbox"
                            checked={(formData.TeachingAudience || []).includes(audience)}
                            onChange={(e) => handleAudienceChange(audience, e.target.checked)}
                            className="w-4 h-4 text-red-600 border-gray-300 rounded focus:ring-red-500"
                          />
                          <span className="text-sm font-medium text-gray-700">{audience}</span>
                        </label>
                      ))}
                    </div>
                  </section>

                  <section>
                    <label className="block text-xs font-bold uppercase tracking-wider text-gray-700">English Proficiency Level</label>
                    <select name="Proficiency Level" onChange={handleChange} className="input-field cursor-pointer" defaultValue="">
                      <option value="">Select proficiency level (optional)</option>
                      <option value="Basic">Basic</option>
                      <option value="Elementary">Elementary</option>
                      <option value="Pre-Intermediate">Pre-Intermediate</option>
                      <option value="Intermediate">Intermediate</option>
                      <option value="Upper-Intermediate">Upper-Intermediate</option>
                      <option value="Advanced">Advanced</option>
                    </select>
                  </section>

                  <section>
                    <label className="block text-xs font-bold uppercase tracking-wider text-gray-700">Supporting Certificate</label>
                    <input type="file" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" onChange={(e) => handleFileChange(e, 'Certificate')} className="input-field" />
                    <p className="text-xs text-gray-400 mt-2">Optional. Upload a certificate that supports your proficiency level.</p>
                  </section>
                </React.Fragment>
              )}

              <section>
                <label className="block text-xs font-bold uppercase tracking-wider text-gray-700">CV <span className="text-red-500">*</span></label>
                <input type="file" accept=".pdf,.doc,.docx" onChange={(e) => handleFileChange(e, 'CV')} className="input-field" required />
              </section>

              <section>
                <label className="block text-xs font-bold uppercase tracking-wider text-gray-700">Portfolio or LinkedIn URL</label>
                <input type="url" name="Portofolio" onChange={handleChange} className="input-field" placeholder="https://..." />
              </section>

              <section className="bg-gray-50 p-4 rounded-lg border border-gray-100 mt-8">
                <label className="flex items-start space-x-3 cursor-pointer">
                  <input type="checkbox" name="agreement" checked={formData.agreement || false} onChange={handleChange} className="mt-1 w-5 h-5 text-red-600 bg-white border-gray-300 rounded focus:ring-red-500 focus:ring-2 cursor-pointer transition" required />
                  <span className="text-sm text-gray-600 leading-relaxed">
                    Dengan ini saya menyatakan bahwa seluruh data dan dokumen yang saya lampirkan adalah <strong>benar dan dapat dipertanggungjawabkan</strong>. Saya bersedia mengikuti seluruh tahapan proses seleksi sesuai aturan perusahaan.
                  </span>
                </label>
              </section>

              <button type="submit" disabled={isSubmitting} className={`w-full py-4 text-white font-bold rounded-xl transition-all duration-300 shadow-md ${isSubmitting ? 'bg-gray-400 cursor-not-allowed' : 'bg-red-600 hover:bg-red-700 hover:shadow-lg transform hover:-translate-y-1'}`}>
                {isSubmitting ? 'MENGIRIM DATA...' : 'KIRIM LAMARAN'}
              </button>
            </form>
          </main>

          {showLoginModal && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
              <div className="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm relative">
                <button onClick={() => setShowLoginModal(false)} className="absolute top-4 right-4 text-gray-400 hover:text-red-600 font-bold text-2xl transition">×</button>

                <div className="flex flex-col items-center mb-6">
                  <div className={`w-12 h-12 text-white rounded-full flex items-center justify-center font-bold text-xl mb-3 ${loginType === 'Admin' ? 'bg-black' : 'bg-red-600'}`}>
                    {loginType === 'Admin' ? 'A' : 'P'}
                  </div>
                  <h3 className="text-2xl font-extrabold text-gray-900">Login {loginType}</h3>
                </div>

                <form onSubmit={handleLoginSubmit} className="space-y-5">
                  {loginType === 'Admin' ? (
                    <React.Fragment>
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">Username</label>
                        <input type="text" value={loginData.username} onChange={(e) => setLoginData({...loginData, username: e.target.value})} className="input-field" placeholder="Masukkan username" required disabled={adminUrl !== ''} />
                      </div>
                      <div>
                        <label className="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">Password</label>
                        <input type="password" value={loginData.password} onChange={(e) => setLoginData({...loginData, password: e.target.value})} className="input-field" placeholder="••••••••" required disabled={adminUrl !== ''} />
                      </div>
                      <div className="flex items-center">
                        <input type="checkbox" id="rememberMe" checked={loginData.rememberMe} onChange={(e) => setLoginData({...loginData, rememberMe: e.target.checked})} className="w-4 h-4 text-red-600 border-gray-300 rounded focus:ring-red-500 cursor-pointer" disabled={adminUrl !== ''} />
                        <label htmlFor="rememberMe" className="ml-2 text-sm font-medium text-gray-600 cursor-pointer">Remember Me</label>
                      </div>
                    </React.Fragment>
                  ) : (
                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">ID Pelamar</label>
                      <input type="text" value={loginData.idPelamar} onChange={(e) => setLoginData({...loginData, idPelamar: e.target.value})} className="input-field" placeholder="Contoh: PLM-171234567" required disabled={adminUrl !== ''} />
                    </div>
                  )}

                  {!adminUrl ? (
                    <button type="submit" disabled={isLoggingIn} className={`w-full py-3 text-white font-bold rounded-xl transition shadow-md ${isLoggingIn ? 'bg-gray-400 cursor-not-allowed' : 'bg-red-600 hover:bg-red-700'}`}>
                      {isLoggingIn ? 'Memverifikasi...' : 'Verifikasi Akun'}
                    </button>
                  ) : (
                    <a href={adminUrl} target="_top" className="block text-center w-full py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl transition shadow-lg animate-pulse">
                      ✅ Mulai / Masuk
                    </a>
                  )}

                  {loginStatus.message && (
                    <div className={`text-center text-sm font-bold mt-3 ${loginStatus.type === 'error' ? 'text-red-600' : 'text-green-600'}`}>
                      {loginStatus.message}
                    </div>
                  )}
                </form>
              </div>
            </div>
          )}

          {dialog.isOpen && (
            <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[70] p-4">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 text-center animate-[fadeIn_0.2s_ease-out] transform transition-all">
                <div className={`w-20 h-20 rounded-full mx-auto mb-5 flex items-center justify-center text-4xl shadow-inner ${dialog.type === 'success' ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}`}>
                  {dialog.type === 'success' ? '✅' : '⚠️'}
                </div>
                <h3 className="text-2xl font-black mb-2 text-gray-900">{dialog.title}</h3>
                <p className="text-gray-600 mb-8 text-sm leading-relaxed">{dialog.message}</p>
                <button onClick={() => setDialog({ ...dialog, isOpen: false })} className="w-full py-3.5 bg-black text-white font-bold rounded-xl hover:bg-gray-800 transition-all shadow-md transform hover:-translate-y-1">
                  Tutup & Lanjutkan
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<JobPortal />);
  </script>
</body>
</html>
